        const getDateStr = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const isWeekend = (date) => {
            const day = date.getDay();
            return day === 0 || day === 6;
        };

        const getShiftLabel = (shift) => {
            if (!shift) return '';
            if (shift.id === 'LEAVE') return shift.icon;
            if (shift.id === 'REST') return shift.icon;
            if (shift.id === 'NORMAL') return shift.icon;
            if (shift.icon.length <= 2) return shift.icon; // For simple emojis
            return shift.name; // For complex names like 日A
        };

        const getShiftName = (shiftId) => {
             if (!shiftId) return "";
             return SHIFT_TYPES[shiftId]?.name || shiftId;
        };

        const getShiftIdByName = (name) => {
            for (const key in SHIFT_TYPES) {
                if (SHIFT_TYPES[key].name === name) return key;
            }
            return null;
        };

        const getExcelCode = (shiftId) => {
            if (!shiftId) return "";
            return SHIFT_TYPES[shiftId]?.excelCode !== undefined ? SHIFT_TYPES[shiftId].excelCode : shiftId;
        };

        const getPayday = (year, month) => {
            let d = new Date(year, month, 25);
            while (true) {
                const dateStr = getDateStr(d);
                const dayOfWeek = d.getDay();
                const isWknd = dayOfWeek === 0 || dayOfWeek === 6;
                const isHol = !!HOLIDAYS[dateStr];
                if (!isWknd && !isHol) {
                    return d;
                }
                d.setDate(d.getDate() - 1);
            }
        };

        // --- TOAST COMPONENT ---
        function Toast({ message, type = 'info', onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColors = {
                info: 'bg-slate-800 text-white',
                success: 'bg-green-600 text-white',
                error: 'bg-red-600 text-white',
                warning: 'bg-yellow-500 text-white'
            };

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-xl z-[100] text-sm font-bold flex items-center gap-2 toast-enter ${bgColors[type]}`}>
                    {type === 'error' && <AlertTriangle size={16} />}
                    {type === 'success' && <CheckIcon size={16} />}
                    {message}
                </div>
            );
        }

        // --- LOGIN COMPONENT ---

            const [inputId, setInputId] = useState('');
            const [error, setError] = useState('');
            const [eggClicks, setEggClicks] = useState(0);
            const eggTimerRef = useRef(null);

            const handleEggClick = () => {
                setEggClicks(prev => {
                    const newCount = prev + 1;
                    if (newCount >= 5) {
                        if (eggTimerRef.current) clearTimeout(eggTimerRef.current);
                        onLogin({ id: 'vip', name: 'v02457', type: 'NORMAL' });
                        return 0;
                    }
                    return newCount;
                });

                if (eggTimerRef.current) clearTimeout(eggTimerRef.current);
                eggTimerRef.current = setTimeout(() => {
                    setEggClicks(0);
                }, 500);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const user = userList.find(u => u.id.toLowerCase() === inputId.toLowerCase());
                if (user) {
                    onLogin(user);
                } else {
                    const initUser = INITIAL_USER_LIST.find(u => u.id.toLowerCase() === inputId.toLowerCase());
                    if (initUser) onLogin(initUser);
                    else setError('工號錯誤，請重新輸入 (例如 v03111)');
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 paper-texture">

                        </div>

                        <p className="text-slate-500 mb-6 text-sm">請輸入您的 6 碼工號以開始使用</p>
                        <form onSubmit={handleLogin} className="space-y-4">

        // --- SHEET BACKUP MODAL (ROBUST FIX) ---
        function GoogleSheetModal({ isOpen, onClose, schedule, displayUsers, daysData, onImport }) {
            const [mode, setMode] = useState('copy'); 
            const [pasteText, setPasteText] = useState('');
            const [copyText, setCopyText] = useState('');
            const [isUploading, setIsUploading] = useState(false);

            useEffect(() => {
                if (isOpen && mode === 'copy') {
                    let text = "姓名\t";
                    daysData.forEach(d => { text += `${d.dateStr}\t`; });
                    text += "\n";
                    displayUsers.forEach(u => {
                        text += `${u.name}\t`;
                        daysData.forEach(d => {
                            const shiftId = schedule[u.name]?.[d.dateStr];
                            const shiftName = getShiftName(shiftId);
                            text += `${shiftName || ''}\t`;
                        });
                        text += "\n";
                    });
                    setCopyText(text);
                }
            }, [isOpen, mode, schedule, displayUsers, daysData]);

            const handleSelectText = () => {
                const textArea = document.getElementById('copy-textarea');
                if (textArea) {
                    textArea.select();
                    try {
                        const successful = document.execCommand('copy');
                        if (successful) alert("已複製！請去 Google Sheets 按 Ctrl+V 貼上");
                        else alert("請按下 Ctrl+C 複製");
                    } catch (err) {
                        alert("請按下 Ctrl+C 複製");
                    }
                }
            };
            
            const handleGoogleUpload = async () => {
                if (!GOOGLE_SCRIPT_URL) {
                    alert("⚠️ 請先在程式碼最上方填入 GOOGLE_SCRIPT_URL");
                    return;
                }
                setIsUploading(true);
                try {
                    const payload = {
                        schedule: schedule,
                        users: displayUsers.map(u => u.name),
                        timestamp: new Date().toISOString()
                    };
                    
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    alert("✅ 已發送上傳請求！\n(因 Google 安全限制無法確認結果，請檢查您的試算表)");
                } catch (e) {
                    console.error(e);
                    alert("❌ 上傳失敗：" + e.message);
                } finally {
                    setIsUploading(false);
                }
            };

            const handleParsePaste = () => {
                if (!pasteText.trim()) return;
                const rows = pasteText.split('\n').map(r => r.split('\t'));
                if (rows.length < 2) { alert("格式看似不正確，請包含標題列"); return; }
                
                const header = rows[0];
                const newSchedule = {}; 
                
                let successCount = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < 2) continue;
                    const name = row[0].trim();
                    if (!name) continue;

                    const userSch = {};
                    for (let j = 1; j < row.length; j++) {
                        const dateStr = header[j]?.trim();
                        const shiftName = row[j]?.trim();
                        
                        if (dateStr && /^\d{4}-\d{2}-\d{2}$/.test(dateStr) && shiftName) {
                            const shiftId = getShiftIdByName(shiftName);
                            if (shiftId) userSch[dateStr] = shiftId;
                        }
                    }
                    if (Object.keys(userSch).length > 0) {
                        newSchedule[name] = userSch;
                        successCount++;
                    }
                }
                
                onImport(newSchedule);
                onClose();
            };
            
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border-4 border-green-600" onClick={e => e.stopPropagation()}>
                        <div className="bg-green-50 p-4 border-b border-green-100 flex justify-between items-center">
                            <h3 className="text-xl font-black text-green-800 flex items-center gap-2"><TableIcon /> Google Sheets 備份助手</h3>
                            <button onClick={onClose}><XIcon className="text-slate-400 hover:text-slate-600"/></button>
                        </div>
                        <div className="flex border-b border-slate-200">
                            <button onClick={() => setMode('copy')} className={`flex-1 py-3 font-bold text-sm flex items-center justify-center gap-2 ${mode === 'copy' ? 'bg-white text-green-700 border-b-2 border-green-600' : 'bg-slate-50 text-slate-500'}`}>
                                <CopyIcon size={16}/> 1. 複製 / 上傳
                            </button>
                            <button onClick={() => setMode('paste')} className={`flex-1 py-3 font-bold text-sm flex items-center justify-center gap-2 ${mode === 'paste' ? 'bg-white text-green-700 border-b-2 border-green-600' : 'bg-slate-50 text-slate-500'}`}>
                                <ClipboardIcon size={16}/> 2. 從試算表還原
                            </button>
                        </div>
                        <div className="p-6">
                            {mode === 'copy' ? (
                                <div className="space-y-4">
                                    <p className="text-slate-600 text-center text-sm">
                                        請點擊下方按鈕選取內容，然後按 <span className="font-mono bg-slate-100 px-1 rounded font-bold">Ctrl+C</span> 複製。
                                    </p>
                                    <textarea 
                                        id="copy-textarea"
                                        value={copyText} 
                                        readOnly
                                        className="w-full h-24 p-3 border-2 border-green-200 rounded-lg focus:border-green-500 outline-none font-mono text-xs bg-slate-50"
                                        onClick={(e) => e.target.select()}
                                    ></textarea>
                                    <div className="flex gap-3">
                                        <button onClick={handleSelectText} className="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold shadow-md hover:bg-green-700 active:scale-95 transition flex items-center justify-center gap-2">
                                            <CopyIcon size={18} /> 全選 (Ctrl+C)
                                        </button>
                                        {GOOGLE_SCRIPT_URL && (
                                            <button onClick={handleGoogleUpload} disabled={isUploading} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md hover:bg-blue-700 active:scale-95 transition flex items-center justify-center gap-2 disabled:bg-gray-400">
                                                {isUploading ? '上傳中...' : <><CloudUploadIcon size={18} /> 上傳 Google</>}
                                            </button>
                                        )}
                                    </div>
                                    {!GOOGLE_SCRIPT_URL && (
                                        <p className="text-xs text-center text-slate-400 mt-2">
                                            (提示：填入 API 網址後可啟用一鍵上傳功能)
                                        </p>
                                    )}
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <p className="text-sm text-slate-500">
                                        請在 Google Sheets 複製包含「姓名」與「日期」的區域，然後貼在下方：
                                    </p>
                                    <textarea 
                                        value={pasteText} 
                                        onChange={e => setPasteText(e.target.value)}
                                        className="w-full h-32 p-3 border-2 border-slate-300 rounded-lg focus:border-green-500 outline-none font-mono text-xs"
                                        placeholder={`姓名\t2025-02-01\t2025-02-02\n周哲維\t日A\t夜B...`}
                                    ></textarea>
                                    <button onClick={handleParsePaste} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition">
                                        📥 解析並合併資料
                                    </button>
                                    <p className="text-xs text-center text-slate-400">注意：這會採用「合併」模式，不會刪除您既有的其他資料。</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP COMPONENT ---
        function ShiftScheduleMatrix() {
            const [currentUser, setCurrentUser] = useState(null); 
            const [viewStartDate, setViewStartDate] = useState(() => {
                const d = new Date();
                d.setDate(d.getDate() - 7); 
                return d;
            });

            const [displayUsers, setDisplayUsers] = useState(INITIAL_USER_LIST);
            const [schedule, setSchedule] = useState({});
            const [rotationCycles, setRotationCycles] = useState({}); 
            const [weekNightCycles, setWeekNightCycles] = useState({}); 
            const [lastModifiedInfo, setLastModifiedInfo] = useState(null); 
            const [changeLogs, setChangeLogs] = useState([]); 
            const [selectedTool, setSelectedTool] = useState(null); 
            const scrollRef = useRef(null);
            
            const [isDragging, setIsDragging] = useState(false);
            const dragStartRef = useRef(false);
            const tempScheduleRef = useRef({}); 
            
            const [activeCell, setActiveCell] = useState(null);
            const [userStatsModal, setUserStatsModal] = useState(null); 
            const [showAutoFill, setShowAutoFill] = useState(false); 
            const [showSheetModal, setShowSheetModal] = useState(false); 
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', msg: '', action: null, isDangerous: false });
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [showLogModal, setShowLogModal] = useState(false); 
            const [toast, setToast] = useState(null);
            const fileInputRef = useRef(null);
            
            const [isLocked, setIsLocked] = useState(true);

            const [targetUser, setTargetUser] = useState(INITIAL_USER_LIST[0].name);
            const [autoStartDate, setAutoStartDate] = useState(getDateStr(new Date()));
            const [autoRule, setAutoRule] = useState('4-2');
            const [autoShiftType, setAutoShiftType] = useState('ROTATION_A');
            const [autoRounds, setAutoRounds] = useState(8); 
            const [autoWeeksDuration, setAutoWeeksDuration] = useState(1);

            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isSaving, setIsSaving] = useState(false); 
            const [isConnected, setIsConnected] = useState(false);
            const [permissionError, setPermissionError] = useState(false);
            const [dataLoaded, setDataLoaded] = useState(false); 

            const showToast = (message, type = 'info') => { setToast({ message, type }); };

            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (error) { console.error("Auth failed:", error); } };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (user) => { setFirebaseUser(user); setIsConnected(!!user); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isConfigured || !firebaseUser || !db) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'shared_matrix');
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    setPermissionError(false); 
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const dbSchedule = data.schedule || {};
                        setSchedule(dbSchedule);
                        setRotationCycles(data.rotationCycles || {});
                        setWeekNightCycles(data.weekNightCycles || {});
                        setChangeLogs(data.changeLogs || []); 
                        if (data.lastModifiedBy && data.lastModifiedAt) {
                            setLastModifiedInfo({ by: data.lastModifiedBy, at: data.lastModifiedAt });
                        }
                        
                        const dbUserNames = Object.keys(dbSchedule);
                        const knownNames = new Set(INITIAL_USER_LIST.map(u => u.name));
                        const newDiscoveredUsers = [];
                        
                        dbUserNames.forEach(name => {
                            if (!knownNames.has(name)) {
                                newDiscoveredUsers.push({
                                    id: `auto-${name}`, 
                                    name: name,
                                    type: 'NORMAL'
                                });
                            }
                        });
                        
                        if (newDiscoveredUsers.length > 0) {
                            setDisplayUsers(prev => {
                                const currentNames = new Set(prev.map(u => u.name));
                                const uniqueNewUsers = newDiscoveredUsers.filter(u => !currentNames.has(u.name));
                                return [...INITIAL_USER_LIST, ...uniqueNewUsers];
                            });
                        }

                        try {
                            localStorage.setItem('shift_schedule_backup', JSON.stringify(data));
                        } catch(e) { console.warn("Local backup failed", e); }
                        
                    } else {
                        const localBackup = localStorage.getItem('shift_schedule_backup');
                        if (localBackup) {
                            showToast("⚠️ 雲端無資料，已從本機備份載入", "warning");
                            const backupData = JSON.parse(localBackup);
                             setSchedule(backupData.schedule || {});
                             setRotationCycles(backupData.rotationCycles || {});
                             setWeekNightCycles(backupData.weekNightCycles || {});
                        } else {
                            setDoc(docRef, { schedule: {}, rotationCycles: {}, weekNightCycles: {}, changeLogs: [] }, { merge: true });
                        }
                    }
                    setDataLoaded(true); 
                }, (error) => {
                    console.error("Sync error:", error);
                    setIsConnected(false);
                    if (error.code === 'permission-denied') { setPermissionError(true); } else { showToast("資料同步失敗，請檢查網路", "error"); }
                });
                return () => unsubscribe();
            }, [firebaseUser]);

            useEffect(() => {
                const handleGlobalMouseUp = () => {
                    if (dragStartRef.current) {
                        dragStartRef.current = false;
                        setIsDragging(false);
                        if (Object.keys(tempScheduleRef.current).length > 0) {
                            const finalSchedule = { ...schedule };
                            Object.keys(tempScheduleRef.current).forEach(u => {
                                finalSchedule[u] = { ...finalSchedule[u], ...tempScheduleRef.current[u] };
                            });
                            const logEntry = {
                                time: new Date().toLocaleString('zh-TW'),
                                user: currentUser ? currentUser.name : 'Unknown',
                                action: '批量修改 (滑鼠拖曳)',
                                detail: `更新了 ${Object.keys(tempScheduleRef.current).length} 位人員的班表`
                            };
                            saveToDb({ schedule: finalSchedule }, false, logEntry);
                            tempScheduleRef.current = {}; 
                        }
                    }
                };
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, [schedule, currentUser]); 

            const saveToDb = (newData = {}, isOverwrite = false, logEntry = null) => {
                return new Promise(async (resolve) => {
                    if (!dataLoaded && !isOverwrite) {
                        showToast("⚠️ 資料尚未讀取完畢，禁止存檔以免覆蓋", "error");
                        resolve(false);
                        return;
                    }

                    const newSchedule = newData.schedule !== undefined ? newData.schedule : schedule;
                    const newRotationCycles = newData.rotationCycles !== undefined ? newData.rotationCycles : rotationCycles;
                    const newWeekNightCycles = newData.weekNightCycles !== undefined ? newData.weekNightCycles : weekNightCycles;
                    
                    let newLogs = [...changeLogs];
                    if (logEntry) {
                        newLogs.unshift(logEntry);
                        if (newLogs.length > 20) newLogs = newLogs.slice(0, 20); 
                    }

                    if (!isConfigured) {
                        setSchedule(newSchedule); setRotationCycles(newRotationCycles); setWeekNightCycles(newWeekNightCycles); setChangeLogs(newLogs);
                        if (!isOverwrite) showToast("尚未設定資料庫，僅暫存於本機", "warning");
                        resolve(true); return;
                    }
                    if (!auth || !firebaseUser) {
                        if (!isOverwrite) showToast("尚未連線，請檢查網路或 Firebase 設定", "error");
                        signInAnonymously(auth).catch(e => console.error(e));
                        resolve(false); return;
                    }
                    if (!db) {
                         if (!isOverwrite) showToast("資料庫未初始化", "error");
                         resolve(false); return;
                    }

                    setIsSaving(true);
                    setPermissionError(false); 
                    const timeoutPromise = new Promise(r => setTimeout(() => r('TIMEOUT'), 15000)); 
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'shared_matrix');
                    const now = new Date();
                    const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    
                    const dataToSave = { 
                        schedule: newSchedule,
                        rotationCycles: newRotationCycles,
                        weekNightCycles: newWeekNightCycles,
                        changeLogs: newLogs,
                        lastModifiedBy: currentUser ? currentUser.name : 'Unknown',
                        lastModifiedAt: timeString
                    };

                    try {
                        const options = { merge: true };
                        const result = await Promise.race([ setDoc(docRef, dataToSave, options), timeoutPromise ]);
                        if (result === 'TIMEOUT') throw new Error("Save timeout");
                        
                        setSchedule(newSchedule); setRotationCycles(newRotationCycles); setWeekNightCycles(newWeekNightCycles); setChangeLogs(newLogs);
                        if (!isOverwrite) showToast("雲端同步成功！", "success");
                        resolve(true);
                    } catch (e) {
                        console.error("Save error:", e);
                        if (e.code === 'permission-denied') { setPermissionError(true); if (!isOverwrite) showToast("儲存失敗：權限不足", "error"); }
                        else if (e.message === "Save timeout") { if (!isOverwrite) showToast("連線逾時，請檢查網路狀況", "warning"); }
                        else { if (!isOverwrite) showToast(`儲存失敗: ${e.message}`, "error"); }
                        resolve(false);
                    } finally { setIsSaving(false); }
                });
            };

            const handleSheetImport = (partialSchedule) => {
                const newSchedule = { ...schedule };
                let updateCount = 0;
                Object.keys(partialSchedule).forEach(user => {
                    const userSch = { ...(newSchedule[user] || {}) };
                    Object.keys(partialSchedule[user]).forEach(date => {
                        userSch[date] = partialSchedule[user][date];
                        updateCount++;
                    });
                    newSchedule[user] = userSch;
                });
                
                saveToDb({ schedule: newSchedule }, false, {
                    time: new Date().toLocaleString('zh-TW'),
                    user: currentUser.name,
                    action: '從 Google Sheet 還原',
                    detail: `更新了 ${updateCount} 筆資料`
                });
                showToast(`成功合併 ${updateCount} 筆資料！`, "success");
            };

            const prevPeriod = () => setViewStartDate(prev => { const d = new Date(prev); d.setDate(d.getDate() - 14); return d; });
            const nextPeriod = () => setViewStartDate(prev => { const d = new Date(prev); d.setDate(d.getDate() + 14); return d; });
            const goToToday = () => { const d = new Date(); d.setDate(d.getDate() - 7); setViewStartDate(d); };

            const handleLogout = async () => {
                await saveToDb({ schedule, rotationCycles, weekNightCycles }, false);
                setCurrentUser(null); setSelectedTool(null);
            };

            const handleCellMouseDown = (e, userName, dateStr) => {
                if (isLocked) {
                    showToast("🔒 請先解除鎖定才能編輯喔！", "warning");
                    return; 
                }
                if (!selectedTool) {
                    const currentShift = schedule[userName]?.[dateStr];
                    setActiveCell({ user: userName, dateStr, currentShift });
                    return;
                }
                dragStartRef.current = true;
                setIsDragging(true);
                tempScheduleRef.current = {}; 
                applyToolToCell(userName, dateStr); 
            };

            const handleCellMouseEnter = (e, userName, dateStr) => {
                if (isLocked) return; 
                if (dragStartRef.current && selectedTool) {
                    applyToolToCell(userName, dateStr);
                }
            };

            const applyToolToCell = (userName, dateStr) => {
                const newSchedule = { ...schedule }; 
                Object.keys(tempScheduleRef.current).forEach(u => {
                    newSchedule[u] = { ...newSchedule[u], ...tempScheduleRef.current[u] };
                });

                const userSchedule = { ...(newSchedule[userName] || {}) };
                if (selectedTool === 'ERASER') {
                    delete userSchedule[dateStr];
                } else {
                    userSchedule[dateStr] = selectedTool;
                }
                
                if (!tempScheduleRef.current[userName]) tempScheduleRef.current[userName] = {};
                 tempScheduleRef.current[userName] = userSchedule;

                newSchedule[userName] = userSchedule;
                setSchedule(newSchedule); 
            };

            const toggleTool = (toolId) => { if (selectedTool === toolId) setSelectedTool(null); else setSelectedTool(toolId); };

            const applyShiftFromModal = (shiftId) => {
                if (!activeCell) return;
                const { user, dateStr } = activeCell;
                const newSchedule = { ...schedule };
                const userSchedule = { ...(newSchedule[user] || {}) };
                
                let actionStr = '';
                if (shiftId === 'ERASER') {
                    delete userSchedule[dateStr];
                    actionStr = '清除';
                } else {
                    userSchedule[dateStr] = shiftId;
                    actionStr = `排班: ${SHIFT_TYPES[shiftId].name}`;
                }
                newSchedule[user] = userSchedule;
                
                const logEntry = {
                    time: new Date().toLocaleString('zh-TW'),
                    user: currentUser.name,
                    action: actionStr,
                    detail: `${user} / ${dateStr}`
                };

                saveToDb({ schedule: newSchedule }, false, logEntry);
                setActiveCell(null);
            };

            const openAutoFillFromCell = () => {
                if (!activeCell) return;
                setTargetUser(activeCell.user); setAutoStartDate(activeCell.dateStr);
                setActiveCell(null); setShowAutoFill(true);
            };

            const confirmClearUser = (userName) => {
                setConfirmModal({
                    show: true, title: `清除 ${userName} 的紀錄`, msg: `確定要清除該人員的所有排班紀錄嗎？\n(注意：不會清除 4-2 輪班與平日小夜的週期背景)`, isDangerous: true,
                    action: () => {
                        const newSchedule = { ...schedule };
                        delete newSchedule[userName];
                        saveToDb({ schedule: newSchedule }, false, {
                            time: new Date().toLocaleString('zh-TW'),
                            user: currentUser.name,
                            action: '清除人員紀錄',
                            detail: `清除了 ${userName} 的所有排班`
                        });
                        setConfirmModal({ show: false });
                        setUserStatsModal(null); 
                    }
                });
            };

            const runAutoFill = () => {
                const start = new Date(autoStartDate);
                if (isNaN(start.getTime())) return;
                let end = new Date(start);
                let endDateStr = '';

                if (autoRule === '4-2') {
                    const totalDays = autoRounds * 4;
                    const endDateObj = new Date(start);
                    endDateObj.setDate(start.getDate() + totalDays - 1); 
                    endDateStr = getDateStr(endDateObj);
                } else if (autoRule === 'week-night') {
                    const endDateObj = new Date(start);
                    endDateObj.setDate(start.getDate() + (autoWeeksDuration * 7) - 1);
                    endDateStr = getDateStr(endDateObj);
                    end = endDateObj; 
                } 

                const newSchedule = { ...schedule };
                const userSch = { ...(newSchedule[targetUser] || {}) };
                let current = new Date(start);

                if (autoRule === '4-2') {
                    const newCycles = { ...rotationCycles };
                    const userCycles = newCycles[targetUser] || [];
                    userCycles.push({ start: autoStartDate, end: endDateStr });
                    newCycles[targetUser] = userCycles;
                    const totalDays = autoRounds * 4;
                    for (let i = 0; i < totalDays; i++) {
                        let d = new Date(start);
                        d.setDate(start.getDate() + i);
                        const dStr = getDateStr(d);
                        if (i % 4 < 2) {
                            userSch[dStr] = autoShiftType;
                        } else {
                            userSch[dStr] = 'REST'; 
                        }
                    }
                    newSchedule[targetUser] = userSch;
                    saveToDb({ schedule: newSchedule, rotationCycles: newCycles }, false, {
                        time: new Date().toLocaleString('zh-TW'),
                        user: currentUser.name,
                        action: '自動排班 (4-2)',
                        detail: `${targetUser} 從 ${autoStartDate}`
                    });
                } else if (autoRule === 'week-night') {
                    const newWNCycles = { ...weekNightCycles };
                    const userWNCycles = newWNCycles[targetUser] || [];
                    userWNCycles.push({ start: autoStartDate, end: endDateStr });
                    newWNCycles[targetUser] = userWNCycles;
                    const endLoop = new Date(start);
                    endLoop.setDate(start.getDate() + (autoWeeksDuration * 7));
                    while (current < endLoop) {
                        const day = current.getDay();
                        if (day !== 6) userSch[getDateStr(current)] = 'EVE_WEEKDAY';
                        current.setDate(current.getDate() + 1);
                    }
                    newSchedule[targetUser] = userSch;
                    saveToDb({ schedule: newSchedule, weekNightCycles: newWNCycles }, false, {
                        time: new Date().toLocaleString('zh-TW'),
                        user: currentUser.name,
                        action: '自動排班 (小夜)',
                        detail: `${targetUser} 從 ${autoStartDate}`
                    });
                }
                setShowAutoFill(false);
            };

            const daysData = useMemo(() => {
                const arr = [];
                for (let i = 0; i < 30; i++) {
                    const date = new Date(viewStartDate);
                    date.setDate(viewStartDate.getDate() + i);
                    const dateStr = getDateStr(date);
                    arr.push({
                        date, dateStr, dayNum: date.getDate(),
                        dayOfWeek: ['日','一','二','三','四','五','六'][date.getDay()],
                        isWeekend: isWeekend(date),
                        holiday: HOLIDAYS[dateStr],
                        monthLabel: `${date.getFullYear()}年${date.getMonth()+1}月`
                    });
                }
                return arr;
            }, [viewStartDate]);

            const monthGroups = useMemo(() => {
                const groups = [];
                if (daysData.length === 0) return groups;
                let currentMonth = daysData[0].monthLabel;
                let count = 0;
                daysData.forEach(day => {
                    if (day.monthLabel === currentMonth) { count++; } 
                    else { groups.push({ label: currentMonth, count }); currentMonth = day.monthLabel; count = 1; }
                });
                groups.push({ label: currentMonth, count });
                return groups;
            }, [daysData]);

            const calculateYearlyStats = (userName) => {
                const year = viewStartDate.getFullYear(); 
                const stats = {};
                const user = displayUsers.find(u => u.name === userName); 

                const d = new Date(year, 0, 1);
                const end = new Date(year, 11, 31);
                
                while (d <= end) {
                    const dateStr = getDateStr(d);
                    const s = schedule[userName]?.[dateStr];
                    
                    if (s) {
                        stats[s] = (stats[s] || 0) + 1;
                    } else {
                        const day = d.getDay();
                        const isWknd = day === 0 || day === 6;
                        const isHol = !!HOLIDAYS[dateStr];
                        
                        if (user && user.type === 'NORMAL' && !isWknd && !isHol) {
                            stats['NORMAL'] = (stats['NORMAL'] || 0) + 1;
                        }
                    }
                    d.setDate(d.getDate() + 1);
                }
                return { stats, year };
            };

            const handleUserClick = (userName) => {
                const { stats, year } = calculateYearlyStats(userName); 
                setUserStatsModal({ name: userName, stats, year });
            };

            // 全年度報表匯出功能 (Styles Enhanced)
            const handleExport = () => {
                if (!schedule) return;
                
                const targetYear = viewStartDate.getFullYear();
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const monthBlocks = []; // Store range info for styling

                const ws_data = [];
                let currentRow = 0;

                for (let month = 0; month < 12; month++) {
                    const firstDay = new Date(targetYear, month, 1);
                    const lastDay = new Date(targetYear, month + 1, 0);
                    const totalDays = lastDay.getDate();
                    const monthStartRow = currentRow;

                    // 1. Header
                    const headerRow = [`${monthNames[month]}-${String(targetYear).slice(-2)}`];
                    const weekendCols = [];
                    const holidayCols = [];

                    for (let d = 1; d <= totalDays; d++) {
                        headerRow.push(d);
                        const currentDate = new Date(targetYear, month, d);
                        const dateStr = getDateStr(currentDate);
                        const day = currentDate.getDay();
                        if (day === 0 || day === 6) weekendCols.push(d); // col index matches day num in this layout
                        if (HOLIDAYS[dateStr]) holidayCols.push(d);
                    }
                    ws_data.push(headerRow);
                    currentRow++;

                    // 2. Data Rows
                    displayUsers.forEach(user => {
                        const row = [user.name];
                        for (let d = 1; d <= totalDays; d++) {
                            const date = new Date(targetYear, month, d);
                            const dateStr = getDateStr(date);
                            const shiftId = schedule[user.name]?.[dateStr];
                            const excelCode = getExcelCode(shiftId);
                            row.push(excelCode);
                        }
                        ws_data.push(row);
                        currentRow++;
                    });

                    // Store metadata for styling
                    monthBlocks.push({
                        startRow: monthStartRow,
                        endRow: currentRow - 1,
                        totalDays: totalDays,
                        weekendCols: weekendCols,
                        holidayCols: holidayCols
                    });

                    // Empty row spacer
                    ws_data.push([]);
                    currentRow++;
                }

                // Create worksheet
                const ws = XLSX.utils.aoa_to_sheet(ws_data);

                // --- Styling Logic ---
                // Helper for borders
                const thinBorder = { style: "thin", color: { rgb: "000000" } };
                const thickBorder = { style: "medium", color: { rgb: "000000" } }; // 'medium' usually looks like standard thick
                const blueFill = { fgColor: { rgb: "DDEBF7" } }; // Light blue Excel color
                const centerAlign = { horizontal: "center", vertical: "center" };

                // Apply styles based on monthBlocks
                monthBlocks.forEach(block => {
                    const lastColIndex = block.totalDays; // 0-indexed column A is name, 1 is day 1...
                    
                    for (let r = block.startRow; r <= block.endRow; r++) {
                        for (let c = 0; c <= lastColIndex; c++) {
                            const cellRef = XLSX.utils.encode_cell({ r, c });
                            if (!ws[cellRef]) ws[cellRef] = { v: "", t: "s" }; // Create cell if empty

                            // Base Style
                            let s = {
                                border: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder },
                                alignment: centerAlign,
                                font: { name: "Calibri", sz: 11 }
                            };

                            // Header specific (Bold)
                            if (r === block.startRow) {
                                s.font.bold = true;
                            }

                            // Holiday/Weekend Fill (Apply to columns > 0)
                            if (c > 0) {
                                // Check if this col is in weekend or holiday list
                                // c is exactly the day number here because col 0 is Name
                                if (block.weekendCols.includes(c) || block.holidayCols.includes(c)) {
                                    s.fill = blueFill;
                                }
                            }

                            // --- Outline Thick Borders ---
                            // Top of block
                            if (r === block.startRow) s.border.top = thickBorder;
                            // Bottom of block
                            if (r === block.endRow) s.border.bottom = thickBorder;
                            // Left of block (Col A)
                            if (c === 0) s.border.left = thickBorder;
                            // Right of block (Last day col)
                            if (c === lastColIndex) s.border.right = thickBorder;

                            ws[cellRef].s = s;
                        }
                    }
                });

                // Set column widths
                const wscols = [{ wch: 10 }]; // Name col
                for(let i=0; i<31; i++) wscols.push({ wch: 4 }); // Day cols narrow
                ws['!cols'] = wscols;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `${targetYear}年全年度班表`);
                XLSX.writeFile(wb, `ShiftSchedule_${targetYear}.xlsx`);
            };

            const handleImportClick = () => { fileInputRef.current.click(); };
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsName = wb.SheetNames[0];
                        const ws = wb.Sheets[wsName];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        if (data.length < 2) { showToast("Excel 格式錯誤或無資料", "error"); return; }
                        const headerRow = data[0];
                        const newSchedule = { ...schedule }; // Use existing schedule to merge
                        
                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];
                            const userName = row[0];
                            const userSch = { ...(newSchedule[userName] || {}) };
                            for (let j = 1; j < row.length; j++) {
                                const dateStr = headerRow[j];
                                const shiftName = row[j];
                                if (dateStr && shiftName) {
                                    const shiftId = getShiftIdByName(shiftName);
                                    if (shiftId) userSch[dateStr] = shiftId;
                                }
                            }
                            newSchedule[userName] = userSch;
                        }
                        saveToDb({ schedule: newSchedule }, false, {
                            time: new Date().toLocaleString('zh-TW'),
                            user: currentUser.name,
                            action: '匯入 Excel',
                            detail: '批量更新班表'
                        });
                        showToast("Excel 匯入合併成功！", "success");
                    } catch (err) { console.error("Import Error:", err); showToast("匯入失敗，請檢查檔案格式", "error"); } finally { e.target.value = ''; }
                };
                reader.readAsBinaryString(file);
            };

            if (!currentUser) { return <LoginScreen onLogin={setCurrentUser} userList={displayUsers} />; }

            return (
                <React.Fragment>
                    <input type="file" ref={fileInputRef} onChange={handleImport} accept=".xlsx, .xls" style={{ display: 'none' }} />
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    <header className="z-30 flex-none bg-white/90 backdrop-blur-sm shadow-sm border-b-2 border-stone-200">
                        <div className="w-full overflow-x-auto hide-scrollbar py-3 px-2">
                            <div className="flex items-center gap-3 min-w-max">
                                <div className="flex flex-col mr-2">
                                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => { if(!isConnected) showToast('尚未連線至雲端', 'error'); }}>
                                        <h1 className="text-2xl font-black text-slate-800 tracking-wider">製程班表(專業版)</h1>
                                        <div className={`w-3 h-3 rounded-full ${isConnected ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]' : 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]'}`} title={isConnected ? "已連線至雲端" : "未連線"}></div>
                                    </div>
                                    <div className="flex items-center gap-2 mt-1">
                                        <div className="flex items-center gap-1 text-sm font-bold text-slate-800"><span className="bg-yellow-200 px-1 rounded text-xs">Hi</span>{currentUser.name}</div>
                                        <button onClick={() => setShowLogModal(true)} className="flex items-center gap-1 text-[10px] text-slate-500 hover:text-blue-600 px-2 py-0.5 bg-white border border-slate-200 rounded-lg hover:border-blue-300 transition"><ScrollTextIcon size={10} /> 紀錄</button>
                                    </div>
                                </div>
                                <div className="flex gap-2 border-r-2 border-slate-200 pr-3 mr-1">
                                    <button onClick={() => saveToDb({ schedule, rotationCycles, weekNightCycles }, false)} disabled={isSaving || !dataLoaded} className={`group relative flex flex-col items-center justify-center p-2 text-white rounded-xl border-2 btn-press active:scale-95 transition shadow-[3px_3px_0px_rgba(21,128,61,1)] ${isSaving || !dataLoaded ? 'bg-gray-400 border-gray-500 cursor-wait' : 'bg-green-500 border-green-700'}`} title="安全存檔"><SaveIcon size={20} /><span className="text-[10px] font-bold mt-0.5">{isSaving ? '...' : '存檔'}</span></button>
                                    <button onClick={handleLogout} className="group relative flex flex-col items-center justify-center p-2 bg-slate-100 text-slate-600 rounded-xl border-2 border-slate-400 btn-press active:scale-95 transition shadow-[3px_3px_0px_rgba(148,163,184,1)] hover:bg-red-50 hover:text-red-600 hover:border-red-400 hover:shadow-[3px_3px_0px_rgba(239,68,68,1)]" title="登出系統"><LogOutIcon size={20} /><span className="text-[10px] font-bold mt-0.5">登出</span></button>
                                </div>
                                <div className="flex items-center bg-white border-2 border-slate-800 rounded-xl px-1 py-1">
                                    <button onClick={prevPeriod} className="p-2 hover:bg-slate-100 rounded-lg transition"><ChevronLeft size={20}/></button>
                                    <div className="px-3 font-black text-lg text-center text-slate-800 leading-tight min-w-[110px]"><span className="text-xs text-slate-400 block">Quick Nav</span></div>
                                    <button onClick={nextPeriod} className="p-2 hover:bg-slate-100 rounded-lg transition"><ChevronRight size={20}/></button>
                                </div>
                                <button onClick={goToToday} className="flex flex-col items-center justify-center px-3 py-2 text-slate-800 hover:bg-slate-100 rounded-xl border-0 btn-press active:scale-95 transition" title="回到今天"><CalendarIcon size={24} /></button>
                                <button onClick={() => setShowSheetModal(true)} className="flex flex-col items-center justify-center px-3 py-2 bg-green-100 text-green-800 rounded-xl border-2 border-green-800 btn-press active:scale-95 transition" title="Google Sheet 備份"><TableIcon size={18} /><span className="text-[10px] font-bold mt-0.5">備份</span></button>
                                <button onClick={handleExport} className="flex flex-col items-center justify-center px-3 py-2 bg-emerald-100 text-emerald-800 rounded-xl border-2 border-emerald-800 btn-press active:scale-95 transition" title="匯出 Excel"><DownloadIcon size={18} /><span className="text-[10px] font-bold mt-0.5">專業匯出</span></button>
                                <button onClick={handleImportClick} className="flex flex-col items-center justify-center px-3 py-2 bg-sky-100 text-sky-800 rounded-xl border-2 border-sky-800 btn-press active:scale-95 transition" title="匯入 Excel"><UploadIcon size={18} /><span className="text-[10px] font-bold mt-0.5">匯入</span></button>
                                <div className="w-0.5 h-10 bg-slate-200 mx-1"></div>
                                {/* 編輯鎖 */}
                                <button 
                                    onClick={() => setIsLocked(!isLocked)} 
                                    className={`flex flex-col items-center justify-center px-3 py-2 rounded-xl border-2 transition-all duration-200 cursor-pointer select-none ${isLocked ? 'bg-red-50 text-red-600 border-red-300' : 'bg-white text-slate-600 border-slate-300 hover:border-slate-500'}`}
                                    title={isLocked ? "編輯鎖定 (唯讀)" : "點擊可編輯"}
                                >
                                    {isLocked ? <LockIcon size={20} /> : <UnlockIcon size={20} />}
                                    <span className="text-[10px] font-bold mt-0.5">{isLocked ? '鎖定' : '編輯'}</span>
                                </button>
                                <div className="w-0.5 h-10 bg-slate-200 mx-1"></div>
                                <button onClick={() => toggleTool(TOOL_ERASER.id)} className={`group relative flex flex-row items-center justify-center gap-2 px-3 py-2 rounded-xl border-2 transition-all duration-200 cursor-pointer select-none ${selectedTool === TOOL_ERASER.id ? 'scale-105 z-10 -translate-y-1 ' + TOOL_ERASER.color.replace('border-', 'border-slate-900 ') : 'bg-white border-slate-200 hover:border-slate-800 hover:-translate-y-0.5 opacity-90 hover:opacity-100'}`}>
                                    <span className="text-xl filter drop-shadow-sm">{TOOL_ERASER.icon}</span><span className={`text-base font-bold ${selectedTool === TOOL_ERASER.id ? 'text-slate-900' : 'text-slate-700'}`}>{TOOL_ERASER.name}</span>{selectedTool === TOOL_ERASER.id && (<div className="absolute -top-2 -right-2 bg-slate-900 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center border-2 border-white">✓</div>)}
                                </button>
                                {Object.values(SHIFT_TYPES).filter(t => t.id !== 'REST' && t.id !== 'NORMAL').map(type => (
                                    <button key={type.id} onClick={() => toggleTool(type.id)} draggable="false" className={`group relative flex flex-row items-center justify-center gap-2 px-3 py-2 rounded-xl border-2 transition-all duration-200 cursor-pointer select-none ${selectedTool === type.id ? 'scale-105 z-10 -translate-y-1 shadow-md ' : 'bg-white hover:bg-slate-50 hover:-translate-y-0.5 opacity-90 hover:opacity-100 shadow-sm border border-slate-200'}`}>
                                        <span className="text-2xl filter drop-shadow-sm leading-none mr-1">{type.icon}</span><span className={`text-xs font-bold ${selectedTool === type.id ? 'text-slate-800' : 'text-slate-700'}`}>{type.name}</span>{selectedTool === type.id && (<div className="absolute -top-2 -right-2 bg-slate-900 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center border-2 border-white">✓</div>)}
                                    </button>
                                ))}
                                <div className="ml-auto pl-4 border-l-2 border-slate-200 flex flex-col items-end justify-center">
                                    {lastModifiedInfo && (<div className="text-[10px] text-slate-400 whitespace-nowrap">Update: {lastModifiedInfo.by} {lastModifiedInfo.at}</div>)}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* 主表格區域 */}
                    <div className="flex-1 overflow-hidden relative flex flex-col">
                        <div className="flex-1 overflow-auto" ref={scrollRef}>
                            <table className="border-collapse w-full min-w-max">
                                <thead className="sticky top-0 z-20 bg-stone-50 shadow-sm">
                                    <tr>
                                        <th className="bg-stone-100 border-b border-r border-stone-300 min-w-[140px]"></th>
                                        {monthGroups.map((group, idx) => (<th key={idx} colSpan={group.count} className="bg-slate-800 text-white border-r border-slate-600 py-1 text-center font-bold text-sm tracking-wider">{group.label}</th>))}
                                    </tr>
                                    <tr>
                                        <th className="sticky left-0 z-30 bg-stone-100 border-b-2 border-r-2 border-stone-300 min-w-[140px] p-2 text-center font-black text-slate-600 text-xl tracking-widest shadow-[2px_0_5px_rgba(0,0,0,0.05)]">姓名</th>
                                        {daysData.map(day => (
                                            <th key={day.dateStr} className={`border-b-2 border-r border-stone-200 min-w-[48px] py-2 text-center relative ${day.holiday ? 'bg-sky-50' : day.isWeekend ? 'bg-rose-50' : 'bg-white'}`}>
                                                <div className={`text-sm font-bold mb-0.5 ${day.isWeekend || day.holiday ? 'text-rose-600' : 'text-slate-500'}`}>{day.dayOfWeek}</div>
                                                <div className={`text-xl font-black leading-none ${getDateStr(new Date()) === day.dateStr ? 'text-blue-600 underline decoration-wavy decoration-2' : 'text-slate-800'}`}>
                                                    {(() => { const payday = getPayday(day.date.getFullYear(), day.date.getMonth()); if (getDateStr(day.date) === getDateStr(payday)) return '🏧'; return day.dayNum; })()}
                                                </div>
                                                {day.holiday && (<div className="absolute -bottom-2 left-0 w-full flex justify-center z-10"><span className="bg-sky-500 text-white border border-sky-700 text-[10px] px-1.5 py-0.5 rounded-full shadow-sm truncate max-w-full font-bold">{day.holiday}</span></div>)}
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {displayUsers.map((userData) => (
                                        <tr key={userData.id} className="group/row bg-white hover:bg-yellow-50/50 transition-colors border-b border-stone-200">
                                            <td className="sticky left-0 z-10 bg-white group-hover/row:bg-yellow-50/50 border-r-2 border-stone-300 p-0 shadow-[4px_0_8px_-4px_rgba(0,0,0,0.1)]">
                                                <div 
                                                    className="px-3 py-2 h-full group/namecell min-w-[140px] flex justify-center items-center cursor-pointer hover:bg-blue-50 transition-colors"
                                                    onClick={() => handleUserClick(userData.name)}
                                                    title="點擊查看統計"
                                                >
                                                    <span className="font-bold text-slate-800 text-lg tracking-wide">{userData.name}</span>
                                                </div>
                                            </td>
                                            {daysData.map(day => {
                                                const shiftId = schedule[userData.name]?.[day.dateStr];
                                                const shift = shiftId && SHIFT_TYPES[shiftId] ? SHIFT_TYPES[shiftId] : null;
                                                const shiftLabel = shift ? getShiftLabel(shift) : (shiftId || ''); // Fallback for unknown shifts
                                                const isRotationUser = schedule.rotationCycles?.[userData.name]?.some(c => { const s = new Date(c.start).getTime(); const e = new Date(c.end).getTime(); const d = new Date(day.date).getTime(); return d >= s && d <= e; });
                                                const isWeekNightUser = schedule.weekNightCycles?.[userData.name]?.some(c => { const s = new Date(c.start).getTime(); const e = new Date(c.end).getTime(); const d = new Date(day.date).getTime(); return d >= s && d <= e; });
                                                let bgClass = 'bg-white';
                                                if (day.holiday) bgClass = 'bg-sky-50';
                                                else if (day.isWeekend) bgClass = 'bg-rose-50';
                                                else if (isWeekNightUser) bgClass = 'bg-purple-50';
                                                else if (isRotationUser) bgClass = 'bg-green-50';
                                                return (
                                                    <td 
                                                        key={`${userData.name}-${day.dateStr}`} 
                                                        onMouseDown={(e) => handleCellMouseDown(e, userData.name, day.dateStr)}
                                                        onMouseEnter={(e) => handleCellMouseEnter(e, userData.name, day.dateStr)}
                                                        className={`border-r border-stone-100 text-center cursor-pointer relative p-1 align-middle hover:bg-slate-100/50 active:bg-slate-200/50 ${bgClass}`}
                                                    >
                                                        {shiftId ? (
                                                            <div className={`w-full h-11 flex items-center justify-center font-black text-xl transition-transform hover:scale-110 hover:z-10 relative rounded-lg ${shift ? shift.color : 'bg-gray-200 text-gray-500 text-xs break-all'}`}>
                                                                {shiftLabel}
                                                            </div>
                                                        ) : (
                                                            <div className="w-full h-10 flex items-center justify-center opacity-0 hover:opacity-30">
                                                                {userData.type === 'NORMAL' && !day.isWeekend && !day.holiday && (<div className="w-1.5 h-1.5 bg-blue-200 rounded-full"></div>)}
                                                            </div>
                                                        )}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showLogModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[90] flex items-center justify-center p-4" onClick={() => setShowLogModal(false)}>
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border-2 border-slate-800 relative max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4 border-b pb-2"><h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><ScrollTextIcon size={24} className="text-blue-600" /> 修改紀錄 (最近20筆)</h3><button onClick={() => setShowLogModal(false)}><XIcon size={24} className="text-slate-400" /></button></div>
                                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                    {changeLogs.length === 0 ? <p className="text-center text-slate-400 py-4">尚無紀錄</p> : changeLogs.map((log, idx) => (
                                        <div key={idx} className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                                            <div className="flex justify-between text-xs text-slate-400 mb-1"><span>{log.time}</span><span className="font-bold text-slate-600">{log.user}</span></div>
                                            <div className="font-bold text-slate-800">{log.action}</div>
                                            <div className="text-slate-500 mt-1">{log.detail}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Google Sheet Modal */}
                    <GoogleSheetModal 
                        isOpen={showSheetModal} 
                        onClose={() => setShowSheetModal(false)} 
                        schedule={schedule}
                        displayUsers={displayUsers}
                        daysData={daysData}
                        onImport={handleSheetImport}
                    />

                    {/* User Stats Modal */}
                    {userStatsModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[80] flex items-center justify-center p-4" onClick={() => setUserStatsModal(null)}>
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 border-2 border-slate-800 animate-in zoom-in-95 duration-200" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6 border-b pb-2">
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2"><ChartBarIcon size={24} className="text-blue-600" />{userStatsModal.name} 統計</h3>
                                    <button onClick={() => setUserStatsModal(null)} className="p-1 text-slate-400 hover:text-slate-600"><XIcon size={24} /></button>
                                </div>
                                <div className="space-y-3 mb-6">
                                    <p className="text-sm text-slate-400 font-bold mb-2">{userStatsModal.year} 年全年度統計</p>
                                    {Object.keys(userStatsModal.stats).length === 0 ? <p className="text-center text-slate-400">此年度無排班紀錄</p> : 
                                        Object.entries(userStatsModal.stats).map(([key, count]) => (
                                            <div key={key} className="flex justify-between items-center p-2 bg-slate-50 rounded-lg border border-slate-100">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-2xl">{SHIFT_TYPES[key]?.icon || '❓'}</span>
                                                    <span className="font-bold text-slate-700">{SHIFT_TYPES[key]?.name || key}</span>
                                                </div>
                                                <span className="font-black text-xl text-slate-800">{count} <span className="text-xs text-slate-400 font-normal">天</span></span>
                                            </div>
                                        ))
                                    }
                                </div>
                                <button 
                                    onClick={() => confirmClearUser(userStatsModal.name)}
                                    className="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold border-2 border-red-200 hover:bg-red-100 transition flex items-center justify-center gap-2"
                                >
                                    <Trash2 size={18} /> 清除此人紀錄
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmModal.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-lg shadow-lg max-w-sm w-full p-6 border-2 border-slate-800 animate-in zoom-in-95 duration-200 -rotate-1">
                                <div className={`w-14 h-14 rounded-full flex items-center justify-center mb-4 border-2 border-slate-800 ${confirmModal.isDangerous ? 'bg-red-100 text-red-500' : 'bg-blue-100 text-blue-500'}`}><AlertTriangle size={30} /></div>
                                <h3 className="text-2xl font-bold text-slate-800 mb-2">{confirmModal.title}</h3>
                                <p className="text-lg text-slate-600 mb-8 leading-relaxed">{confirmModal.msg}</p>
                                <div className="flex gap-3"><button onClick={() => setConfirmModal({ show: false })} className="flex-1 py-3 rounded-lg border-2 border-slate-300 text-slate-600 font-bold hover:bg-slate-50 transition btn-press">取消</button><button onClick={confirmModal.action} className={`flex-1 py-3 rounded-lg text-white font-bold border-2 border-slate-800 btn-press transition ${confirmModal.isDangerous ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-500 hover:bg-blue-600'}`}>確定</button></div>
                            </div>
                        </div>
                    )}
                    {/* Cell Menu Modal - 只有在未鎖定時才允許點擊觸發 (已在 handleCellClick 阻擋) */}
                    {activeCell && !isLocked && (
                        <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setActiveCell(null)}>
                            <div className="bg-white rounded-xl shadow-xl p-4 w-full max-w-sm border-2 border-slate-800 animate-in zoom-in-95 duration-200" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
                                    <div className="flex flex-col"><span className="text-xs font-bold text-slate-400">當日排班設定</span><span className="text-xl font-black text-slate-800">{activeCell.user} <span className="text-slate-400 mx-1">/</span> {activeCell.dateStr}</span></div>
                                    <button onClick={() => setActiveCell(null)} className="p-1 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100"><XIcon size={24} /></button>
                                </div>
                                <div className="grid grid-cols-3 gap-3 mb-4">
                                    {Object.values(SHIFT_TYPES).filter(t => t.id !== 'REST' && t.id !== 'NORMAL').map(type => (
                                        <button key={type.id} onClick={() => applyShiftFromModal(type.id)} className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all btn-press ${activeCell.currentShift === type.id ? 'border-slate-800 bg-slate-50 ring-2 ring-slate-800 ring-offset-1' : 'border-slate-200 bg-white hover:border-slate-400'}`}>
                                            <div className="text-3xl mb-1">{type.icon}</div>
                                            <span className="text-sm font-bold text-slate-700">{type.name}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-3 pt-2 border-t border-slate-200">
                                    <button onClick={() => applyShiftFromModal('ERASER')} className="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-slate-300 text-slate-600 font-bold hover:bg-slate-50 btn-press"><Trash2 size={18} />清除當日</button>
                                    <button onClick={openAutoFillFromCell} className="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-slate-800 bg-yellow-100 text-slate-900 font-bold hover:bg-yellow-200 btn-press"><Zap size={18} fill="currentColor" className="text-yellow-600" />從此排班</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {showAutoFill && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-yellow-100 rounded-lg shadow-lg max-w-sm w-full p-6 border-2 border-slate-900 relative rotate-1">
                                <button onClick={() => setShowAutoFill(false)} className="absolute -top-3 -right-3 bg-white border-2 border-slate-900 rounded-full p-1 hover:rotate-90 transition text-slate-900 shadow-sm"><XIcon size={20} /></button>
                                <h3 className="text-2xl font-black text-slate-800 mb-6 flex items-center gap-2 border-b-2 border-slate-900 border-dashed pb-2"><Zap className="text-orange-500 fill-current" />自動排班魔法</h3>
                                <div className="space-y-4">
                                    <div><label className="text-lg font-bold text-slate-700">對象與開始日</label><div className="p-3 bg-white border-2 border-slate-400 rounded-lg flex justify-between items-center"><span className="font-bold text-xl text-slate-800">{targetUser}</span><span className="text-sm font-bold text-slate-500">{autoStartDate} 起</span></div></div>
                                    <div>
                                        <label className="text-lg font-bold text-slate-700">規則是？</label>
                                        <div className="mt-1 grid grid-cols-1 gap-2">
                                            <button onClick={() => { setAutoRule('4-2'); setAutoShiftType('DAY_A'); }} className={`p-3 rounded-lg border-2 text-left transition-all flex items-center gap-3 btn-press ${autoRule === '4-2' ? 'border-orange-600 bg-orange-100 text-slate-900' : 'border-slate-300 bg-white text-slate-500'}`}><div className="font-bold text-lg">四班二輪</div><div className="text-sm font-bold bg-white px-2 rounded border border-slate-300">做2休2</div></button>
                                            <button onClick={() => { setAutoRule('week-night'); setAutoShiftType('EVE_WEEKDAY'); }} className={`p-3 rounded-lg border-2 text-left transition-all flex items-center gap-3 btn-press ${autoRule === 'week-night' ? 'border-violet-600 bg-violet-100 text-slate-900' : 'border-slate-300 bg-white text-slate-500'}`}><div className="font-bold text-lg">平日小夜</div><div className="text-sm font-bold bg-white px-2 rounded border border-slate-300">週六休</div></button>
                                        </div>
                                    </div>
                                    <div className="mt-4 p-4 bg-white/50 rounded-lg border-2 border-slate-300 border-dashed">
                                        {autoRule === '4-2' && (<div className="animate-in fade-in slide-in-from-top-2 space-y-3"><div><label className="text-lg font-bold text-slate-700 block mb-1">幾個回合？</label><div className="flex items-center gap-2"><input type="number" min="1" max="50" value={autoRounds} onChange={e => setAutoRounds(Number(e.target.value))} className="w-20 bg-white border-2 border-slate-400 rounded p-1 text-center font-bold text-2xl text-slate-800 outline-none focus:border-slate-900" /><span className="text-lg font-bold text-slate-500">= <span className="text-slate-800">{autoRounds * 4}</span> 天</span></div></div><div><label className="text-lg font-bold text-slate-700 block mb-1">班別</label><div className="flex gap-2">
                                            {/* AutoFill buttons updated to use new shifts */}
                                            <button onClick={() => setAutoShiftType('DAY_A')} className={`flex-1 py-2 rounded-lg text-lg font-bold border-2 btn-press ${autoShiftType === 'DAY_A' ? 'bg-green-500 text-white border-green-700' : 'bg-white text-slate-500 border-slate-300'}`}>日A</button>
                                            <button onClick={() => setAutoShiftType('DAY_B')} className={`flex-1 py-2 rounded-lg text-lg font-bold border-2 btn-press ${autoShiftType === 'DAY_B' ? 'bg-yellow-500 text-white border-yellow-700' : 'bg-white text-slate-500 border-slate-300'}`}>日B</button>
                                            <button onClick={() => setAutoShiftType('NIGHT_A')} className={`flex-1 py-2 rounded-lg text-lg font-bold border-2 btn-press ${autoShiftType === 'NIGHT_A' ? 'bg-purple-500 text-white border-purple-700' : 'bg-white text-slate-500 border-slate-300'}`}>夜A</button>
                                            <button onClick={() => setAutoShiftType('NIGHT_B')} className={`flex-1 py-2 rounded-lg text-lg font-bold border-2 btn-press ${autoShiftType === 'NIGHT_B' ? 'bg-indigo-500 text-white border-indigo-700' : 'bg-white text-slate-500 border-slate-300'}`}>夜B</button>
                                        </div></div></div>)}
                                        {autoRule === 'week-night' && (<div className="animate-in fade-in slide-in-from-top-2"><label className="text-lg font-bold text-slate-700 block mb-1">持續幾週？</label><div className="flex items-center gap-2"><input type="number" min="1" max="52" value={autoWeeksDuration} onChange={e => setAutoWeeksDuration(Number(e.target.value))} className="w-20 bg-white border-2 border-slate-400 rounded p-1 text-center font-bold text-2xl text-slate-800" /><span className="text-lg font-bold text-slate-500">週</span></div></div>)}
                                    </div>
                                </div>
                                <div className="mt-6 flex gap-3"><button onClick={() => setShowAutoFill(false)} className="flex-1 py-3 rounded-lg font-bold border-2 border-slate-400 text-slate-500 hover:bg-slate-100 transition btn-press">算了吧</button><button onClick={runAutoFill} className="flex-1 py-3 rounded-lg font-bold border-2 border-slate-800 bg-slate-800 text-white hover:bg-slate-700 btn-press transition">寫入！</button></div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShiftScheduleMatrix />);
    </script>
</body>
</html>
