  v8.1  「上班」縮成人數只在手機、平板生效，電腦一律顯示名字

  v7.5  桌曆改成固定一左（日班）一右（夜班），週休與國定假日的休不顯示
  v7.4  小秘密：從左上角「紀錄」補登舊的修改紀錄
  v7.3  小秘密：滑鼠移到格子上顯示最後是誰、何時修改
  v7.2  桌曆分上班／休假兩區、加「看某個人」；表格拿掉輪班淺綠底色
  v7.1  修正 Firebase 載入順序造成的白畫面錯誤
  v7.0  萬年曆（自動農曆與補假）、桌曆檢視、前休一規則、多項錯誤修正
  v6.1  強力橡皮擦版
-->

        // 萬年曆：農曆換算 + 台灣國定假日 + 補假（依《紀念日及節日實施條例》）
        // 不需逐年手動輸入，任何年份皆自動計算
        // =====================================================================
        const getDateStr = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // 'YYYY-MM-DD' 一律以本地時間解析（避免 new Date('YYYY-MM-DD') 被當成 UTC）
        const parseDateStr = (s) => {
            const [y, m, d] = String(s).split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const addDays = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d; };

        // 備援用：瀏覽器若不支援農曆換算時才會用到
        const LUNAR_FALLBACK = {
            '2024': { CNY: '02-10', Dragon: '06-10', Moon: '09-17' },
            '2025': { CNY: '01-29', Dragon: '05-31', Moon: '10-06' },
            '2026': { CNY: '02-17', Dragon: '06-19', Moon: '09-25' },
            '2027': { CNY: '02-06', Dragon: '06-09', Moon: '09-15' },
            '2028': { CNY: '01-26', Dragon: '05-28', Moon: '10-03' },
            '2029': { CNY: '02-13', Dragon: '06-16', Moon: '09-22' },
            '2030': { CNY: '02-03', Dragon: '06-05', Moon: '09-12' }
        };

        const LUNAR_FMT = (() => {
            try { return new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { month: 'numeric', day: 'numeric' }); }
            catch (e) { return null; }
        })();

        const lunarCache = new Map();
        // 回傳 { month, day, leap }，不支援時回傳 null
        const getLunar = (date) => {
            if (!LUNAR_FMT) return null;
            const key = getDateStr(date);
            if (lunarCache.has(key)) return lunarCache.get(key);
            let result = null;
            try {
                const parts = LUNAR_FMT.formatToParts(date);
                const mStr = parts.find(p => p.type === 'month')?.value || '';
                const dStr = parts.find(p => p.type === 'day')?.value || '';
                const month = parseInt(mStr.replace(/\D/g, ''), 10);
                const day = parseInt(dStr.replace(/\D/g, ''), 10);
                if (month && day) result = { month, day, leap: /閏|bis/i.test(mStr) };
            } catch (e) { }
            lunarCache.set(key, result);
            return result;
        };

        const LUNAR_MONTH_NAMES = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '臘月'];
        const LUNAR_DAY_NAMES = ['', '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
            '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
            '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

        // 桌曆上顯示的農曆小字（初一顯示月份）
        const getLunarText = (date) => {
            const l = getLunar(date);
            if (!l) return '';
            if (l.day === 1) return (l.leap ? '閏' : '') + LUNAR_MONTH_NAMES[l.month];
            return LUNAR_DAY_NAMES[l.day] || '';
        };

        // 在某段公曆日期區間中，找出農曆 (月, 日) 的那一天（非閏月）
        const findLunarDate = (year, lunarMonth, lunarDay, fromMonth, toMonth) => {
            let d = new Date(year, fromMonth - 1, 1);
            const end = new Date(year, toMonth, 0);
            while (d <= end) {
                const l = getLunar(d);
                if (l && !l.leap && l.month === lunarMonth && l.day === lunarDay) return new Date(d);
                d = addDays(d, 1);
            }
            return null;
        };

        const getLunarKeyDates = (year) => {
            let cny = findLunarDate(year, 1, 1, 1, 2);
            let dragon = findLunarDate(year, 5, 5, 5, 7);
            let moon = findLunarDate(year, 8, 15, 9, 10);
            const fb = LUNAR_FALLBACK[String(year)];
            if (fb) {
                if (!cny) cny = parseDateStr(`${year}-${fb.CNY}`);
                if (!dragon) dragon = parseDateStr(`${year}-${fb.Dragon}`);
                if (!moon) moon = parseDateStr(`${year}-${fb.Moon}`);
            }
            return { cny, dragon, moon };
        };

        // 清明（節氣公式，適用 2001-2099）
        const getQingmingDay = (year) => {
            const y = year % 100;
            return Math.floor(y * 0.2422 + 4.81) - Math.floor(y / 4);

        const holidayCache = new Map();

            if (holidayCache.has(year)) return holidayCache.get(year);
            const map = new Map();       // dateStr -> 名稱
            const base = [];             // { date, name, cny }
            const add = (date, name, cny = false) => { if (date) base.push({ date, name, cny }); };
            const D = (m, d) => new Date(year, m - 1, d);

            // 1. 固定日期
            add(D(1, 1), '元旦');
            add(D(2, 28), '228');
            add(D(5, 1), '勞動節');
            if (year >= 2025) add(D(9, 28), '教師節');
            add(D(10, 10), '國慶');
            if (year >= 2025) add(D(10, 25), '光復節');
            if (year >= 2025) add(D(12, 25), '行憲紀念');

            // 2. 兒童節 + 清明（同一天時兒童節提前一日；同一天又逢週四時改後一日）
            const qm = getQingmingDay(year);
            add(D(4, qm), '清明');
            if (qm === 4) {
                add(D(4, 4).getDay() === 4 ? D(4, 5) : D(4, 3), '兒童節');
            } else {
                add(D(4, 4), '兒童節');
            }

            // 3. 農曆節日
            const { cny, dragon, moon } = getLunarKeyDates(year);
            if (cny) {
                if (year >= 2026) add(addDays(cny, -2), '小年夜', true);
                add(addDays(cny, -1), '除夕', true);
                add(cny, '初一', true);
                add(addDays(cny, 1), '初二', true);
                add(addDays(cny, 2), '初三', true);
            }
            add(dragon, '端午');
            add(moon, '中秋');

            base.forEach(h => map.set(getDateStr(h.date), h.name));

            // 4. 補假：週六 → 前一個上班日；週日 → 次一個上班日；春節逢例假 → 春節後的上班日
            const isTaken = (d) => d.getDay() === 0 || d.getDay() === 6 || map.has(getDateStr(d));
            const cnyDays = base.filter(h => h.cny);
            const lastCny = cnyDays.length ? cnyDays.reduce((a, b) => (a.date > b.date ? a : b)).date : null;
            let cnyCursor = lastCny;

            base.slice().sort((a, b) => a.date - b.date).forEach(h => {
                const dow = h.date.getDay();
                if (dow !== 0 && dow !== 6) return;
                let target;
                if (h.cny) {
                    target = addDays(cnyCursor, 1);
                    while (isTaken(target)) target = addDays(target, 1);
                    cnyCursor = target;
                } else if (dow === 6) {
                    target = addDays(h.date, -1);
                    while (isTaken(target)) target = addDays(target, -1);
                } else {
                    target = addDays(h.date, 1);
                    while (isTaken(target)) target = addDays(target, 1);
                }
                map.set(getDateStr(target), `${h.name}補假`);
            });

            holidayCache.set(year, map);
            return map;
        };

        const getHolidayName = (date) => {
            const y = date.getFullYear();

        // --- SHEET BACKUP MODAL ---

        // --- 桌曆檢視：每天分「上班」與「休假」兩區，一眼看出誰上班、誰休假 ---
        const CAL_WORK_ORDER = ['DAY_A', 'DAY_B', 'NIGHT_A', 'NIGHT_B', 'NORMAL', 'EVE_WEEKDAY', 'EVE_WEEKEND', 'LITTLE_NIGHT', 'ROTATION_C', 'MANAGER'];
        const CAL_SHIFT_ORDER = CAL_WORK_ORDER;

        // 判斷某人某天的狀態：{ kind: 'work' | 'rest' | 'leave' | 'none', shiftId }
        const getDayStatus = (user, sid, date) => {
            if (sid === 'LEAVE') return { kind: 'leave', shiftId: 'LEAVE' };
            if (sid === 'REST') return { kind: 'rest', shiftId: 'REST' };
            if (sid && SHIFT_TYPES[sid]) return { kind: 'work', shiftId: sid };
            if (sid === 'NORMAL') return { kind: 'work', shiftId: 'WORK' };
            // 沒排班：平日一律算上班；週末/假日常日人員算休，其他人不顯示
            if (!(isWeekend(date) || getHolidayName(date))) return { kind: 'work', shiftId: 'WORK' };
            if (user.type === 'NORMAL') return { kind: 'rest', shiftId: 'REST' };
            return { kind: 'none', shiftId: null };
        };

        // 輪班人員休息時，往前後找最近一天的班，判斷他是哪一組（日A/日B/夜A/夜B）
        const ROTATION_SHIFTS = ['DAY_A', 'DAY_B', 'NIGHT_A', 'NIGHT_B'];
        const getCrew = (userSch, date) => {
            if (!userSch) return null;
            for (let k = 0; k <= 6; k++) {
                for (const off of (k === 0 ? [0] : [-k, k])) {
                    const v = userSch[getDateStr(addDays(date, off))];
                    if (ROTATION_SHIFTS.includes(v)) return v;

            return null;
        };
        // 桌曆用的「上班」：沒排班或排常日的人
        const CAL_SHIFTS = { ...SHIFT_TYPES, WORK: { ...SHIFT_TYPES.NORMAL, id: 'WORK', name: '上班' } };
        // 桌曆配色（只影響桌曆）：A 組一色、B 組一色（日夜同色）、上班一色、請假一色、四二輪休假一色
        const CAL_COLORS = {
            A: 'bg-sky-100 text-sky-900 border-sky-300',
            B: 'bg-amber-100 text-amber-900 border-amber-300',
            WORK: 'bg-emerald-50 text-emerald-800 border-emerald-300',

        };
        // 小卡的色調：左側色線、淡底色、標籤字色、名字字色
        const CAL_TONE = {
            A: { bar: 'border-l-sky-600', bg: 'bg-sky-100', label: 'text-sky-800', text: 'text-slate-900' },
            B: { bar: 'border-l-amber-500', bg: 'bg-amber-100', label: 'text-amber-800', text: 'text-slate-900' },
            WORK: { bar: 'border-l-emerald-600', bg: 'bg-emerald-50', label: 'text-emerald-800', text: 'text-slate-900' },
            LEAVE: { bar: 'border-l-rose-600', bg: 'bg-rose-100', label: 'text-rose-700', text: 'text-rose-900' },
            REST: { bar: 'border-l-slate-400', bg: 'bg-slate-100', label: 'text-slate-500', text: 'text-slate-600' }
        };
        const calColor = (k) => {
            if (k === 'DAY_A' || k === 'NIGHT_A') return CAL_COLORS.A;
            if (k === 'DAY_B' || k === 'NIGHT_B') return CAL_COLORS.B;
            if (k === 'LEAVE') return CAL_COLORS.LEAVE;
            if (k === 'REST') return CAL_COLORS.REST;
            return CAL_COLORS.WORK; // 常日、小夜、平日夜、C班、主管值班…都算「上班」
        };
        const BOTTOM_ORDER = ['WORK', 'EVE_WEEKDAY', 'EVE_WEEKEND', 'LITTLE_NIGHT', 'ROTATION_C', 'MANAGER'];

        // 視窗大小（手機翻轉、iPhone Duo 開合時會即時更新）
        const useViewport = () => {
            const get = () => ({ w: window.innerWidth, h: window.innerHeight });
            const [vp, setVp] = useState(get);
            useEffect(() => {
                const on = () => setVp(get());
                window.addEventListener('resize', on);
                window.addEventListener('orientationchange', on);
                return () => { window.removeEventListener('resize', on); window.removeEventListener('orientationchange', on); };
            }, []);
            return vp;
        };

        function DeskCalendarView({ monthDate, schedule, displayUsers, onDayClick }) {
            const [focusUser, setFocusUser] = useState(() => { try { return localStorage.getItem('shift_cal_focus') || ''; } catch (e) { return ''; } });
            const changeFocus = (name) => { const v = focusUser === name ? '' : name; setFocusUser(v); try { localStorage.setItem('shift_cal_focus', v); } catch (e) { } };
            const { w: vw, h: vh } = useViewport();

            // 版面模式：窄螢幕（手機、iPhone Duo 外螢幕）用「清單」，其他用「月曆格」
            const listMode = vw < 600;
            const stackDuty = !listMode && vw < 820;   // 格子太窄時，日/夜改成上下排，名字才不會被切掉
            // 只有手機、平板（觸控螢幕）在畫面太矮或太窄時，「上班」才縮成人數；電腦一律列出名字
            const isTouch = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
            const compactWork = !listMode && isTouch && (vh < 720 || vw < 820);
            const shortLabel = !listMode && !stackDuty && vw < 1100;    // 格子偏窄（如 iPhone Duo 橫向）：日夜並排時標籤只留「日／夜」，A/B 看顏色

            const year = monthDate.getFullYear();
            const month = monthDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const offset = firstDay.getDay();
            const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;
            const todayStr = getDateStr(new Date());
            const paydayStr = getDateStr(getPayday(year, month));
            const focusUserObj = displayUsers.find(u => u.name === focusUser);

            // 本月焦點人員的上班/休假天數
            let focusWork = 0, focusOff = 0;
            if (focusUserObj) {
                for (let d = 1; d <= daysInMonth; d++) {
                    const date = new Date(year, month, d);
                    const st = getDayStatus(focusUserObj, schedule[focusUser]?.[getDateStr(date)], date);
                    if (st.kind === 'work') focusWork++; else if (st.kind === 'rest' || st.kind === 'leave') focusOff++;
                }
            }

            // 清單模式：打開時自動捲到今天
            const todayRowRef = useRef(null);
            useEffect(() => {
                if (listMode && todayRowRef.current) todayRowRef.current.scrollIntoView({ block: 'start' });
            }, [listMode, year, month]);

            // 算出某一天各層的人
            const computeDay = (date) => {
                const dateStr = getDateStr(date);
                const holiday = getHolidayName(date);
                const weekend = isWeekend(date);
                const offDay = weekend || !!holiday;
                const L = { work: {}, rest: {} }, R = { work: {}, rest: {} };
                const bottom = {}; const leave = []; const otherRest = [];
                displayUsers.forEach(u => {
                    const userSch = schedule[u.name];
                    const sid = userSch?.[dateStr];
                    const push = (obj, key) => (obj[key] = obj[key] || []).push(u.name);
                    if (sid === 'DAY_A' || sid === 'DAY_B') push(L.work, sid);
                    else if (sid === 'NIGHT_A' || sid === 'NIGHT_B') push(R.work, sid);
                    else if (sid === 'LEAVE') leave.push(u.name);
                    else if (sid === 'NORMAL') push(bottom, 'WORK');
                    else if (sid && SHIFT_TYPES[sid] && sid !== 'REST') push(bottom, sid);
                    else if (sid === 'REST') {
                        const crew = getCrew(userSch, date);
                        if (crew && crew.startsWith('DAY')) push(L.rest, crew);
                        else if (crew) push(R.rest, crew);
                        else if (!offDay) otherRest.push(u.name); // 週休、國定假日的休不顯示
                    } else if (!sid && !offDay) push(bottom, 'WORK'); // 規則：除了四二輪與已標示休假的，其餘都是上班
                });
                const toRows = (side, kind) => Object.keys(side[kind]).sort().map(k => ({ crew: k, names: side[kind][k] }));
                return {
                    dateStr, holiday, weekend, lunarText: getLunarText(date),
                    isToday: dateStr === todayStr, isPayday: dateStr === paydayStr,
                    lw: toRows(L, 'work'), rw: toRows(R, 'work'), lr: toRows(L, 'rest'), rr: toRows(R, 'rest'),
                    bottom, leave, otherRest,
                    focusSt: focusUserObj ? getDayStatus(focusUserObj, schedule[focusUser]?.[dateStr], date) : null
                };
            };

            const NameList = ({ names }) => names.map((n, i) => (
                <React.Fragment key={n}>
                    <span className={`inline-block whitespace-nowrap ${n === focusUser ? 'bg-slate-900 text-white rounded px-0.5' : ''}`}>{n}{i < names.length - 1 && <span className="text-current opacity-60">、</span>}</span>
                </React.Fragment>
            ));

            // 統一的小卡：左邊一條色線＋兩個字的標籤＋名字
            const Chip = ({ tone, label, names, wrap = false, countOnly = false, tight = false }) => {
                const t = CAL_TONE[tone];
                return (
                    <div className={`flex items-start ${tight ? 'gap-0.5 pl-1 pr-0.5' : 'gap-1.5 pl-1.5 pr-1'} rounded-r-md border-l-[3px] py-[3px] [@media(max-height:820px)]:py-px min-w-0 ${t.bar} ${t.bg}`}>
                        <span className={`shrink-0 font-black ${t.label}`}>{label}</span>
                        <span className={`min-w-0 font-bold ${t.text} ${wrap ? '' : 'truncate'}`}>
                            {countOnly ? `${names.length} 人${names.includes(focusUser) ? '（含 ' + focusUser + '）' : ''}`
                                : wrap ? <NameList names={names} />
                                : names.map((n, i) => <React.Fragment key={n}>{i > 0 && '、'}<span className={n === focusUser ? 'bg-slate-900 text-white rounded px-0.5' : ''}>{n}</span></React.Fragment>)}
                        </span>
                    </div>
                );
            };
            const toneOf = (crew) => crew.endsWith('_A') ? 'A' : 'B';

            const FocusBadge = ({ st }) => (
                <span className={`px-1.5 rounded font-black text-[11px] leading-tight border ${st.kind === 'work' ? calColor(st.shiftId) : st.kind === 'leave' ? CAL_COLORS.LEAVE : st.kind === 'rest' ? CAL_COLORS.REST : 'bg-white text-slate-300 border-dashed border-slate-200'}`}>
                    {st.kind === 'work' ? CAL_SHIFTS[st.shiftId].name : st.kind === 'leave' ? '請假' : st.kind === 'rest' ? '休' : '未排'}
                </span>
            );

            // 一個 2 欄（或窄畫面時上下排）的日／夜列
            const PairRows = ({ left, right, tone }) => {
                const rows = Math.max(left.length, right.length);
                if (stackDuty) {
                    return [...left, ...right].map(g => <Chip key={g.crew} tone={tone || toneOf(g.crew)} label={SHIFT_TYPES[g.crew].name} names={g.names} />);
                }
                return Array.from({ length: rows }).map((_, i) => (
                    <div key={i} className="grid grid-cols-2 gap-[3px]">
                        {[left[i], right[i]].map((g, j) => g ? <Chip key={j} tight={shortLabel} tone={tone || toneOf(g.crew)} label={shortLabel ? SHIFT_TYPES[g.crew].name.slice(0, 1) : SHIFT_TYPES[g.crew].name} names={g.names} /> : <div key={j}></div>)}
                    </div>
                ));
            };

            // 四層內容：值班 → 上班 → 請假 → 四二輪休假（貼底）
            const Layers = ({ d, stretch = true }) => (
                <div className={`${stretch ? 'flex-1' : ''} flex flex-col gap-[3px] text-[12px] max-[1600px]:text-[11px] leading-[1.3] [@media(max-height:820px)]:leading-[1.15] ${listMode ? '!text-[13px]' : ''} ${d.focusSt ? 'opacity-45' : ''}`}>
                    <PairRows left={d.lw} right={d.rw} />
                    {BOTTOM_ORDER.filter(k => d.bottom[k]).map(k => <Chip key={k} tone="WORK" label={CAL_SHIFTS[k].name} names={d.bottom[k]} wrap countOnly={compactWork && k === 'WORK'} />)}
                    {d.leave.length > 0 && <Chip tone="LEAVE" label="請假" names={d.leave} wrap />}
                    <div className={`${stretch ? 'mt-auto' : ''} flex flex-col gap-[3px] pt-[3px]`}>
                        <PairRows left={d.lr} right={d.rr} tone="REST" />
                        {d.otherRest.length > 0 && <Chip tone="REST" label="休" names={d.otherRest} wrap />}
                    </div>
                </div>
            );

            const header = (
                <div className="shrink-0 bg-slate-800 text-white px-3 py-1.5 flex items-center gap-3 flex-wrap">
                    <div className="text-xl font-black tracking-widest whitespace-nowrap">{year} 年 {month + 1} 月</div>
                    <div className={`flex items-center gap-1 ml-auto ${listMode ? 'w-full overflow-x-auto hide-scrollbar flex-nowrap pb-0.5' : 'flex-wrap'}`}>
                        <span className="text-xs font-black text-slate-300 mr-0.5 shrink-0">👀</span>
                        {displayUsers.map(u => (
                            <button key={u.id} onClick={() => changeFocus(u.name)} className={`shrink-0 px-2 py-0.5 rounded-full text-xs font-bold border transition ${focusUser === u.name ? 'bg-yellow-300 text-slate-900 border-yellow-300' : 'bg-slate-700 text-slate-200 border-slate-600 hover:border-slate-300'}`}>{u.name}</button>
                        ))}
                        {focusUserObj && <span className="shrink-0 ml-1 text-xs font-bold text-slate-300 whitespace-nowrap">上班 <span className="text-green-300 text-sm">{focusWork}</span>・休 <span className="text-rose-300 text-sm">{focusOff}</span></span>}
                    </div>
                </div>
            );

            // ===== 清單模式（手機直向、iPhone Duo 外螢幕）=====
            if (listMode) {
                const days = Array.from({ length: daysInMonth }, (_, i) => new Date(year, month, i + 1));
                return (
                    <div className="flex-1 min-h-0 flex flex-col p-1.5">
                        <div className="flex-1 min-h-0 w-full bg-white rounded-2xl border-[3px] border-slate-800 overflow-hidden flex flex-col">
                            {header}
                            <div className="flex-1 min-h-0 overflow-y-auto overscroll-contain">
                                {days.map(date => {
                                    const d = computeDay(date);
                                    const red = d.holiday || d.weekend;
                                    return (
                                        <div key={d.dateStr} ref={d.isToday ? todayRowRef : null} onClick={() => onDayClick(d.dateStr)}
                                            className={`flex gap-2 px-2 py-2 border-b border-slate-200 active:bg-amber-50 ${d.holiday ? 'bg-sky-50/50' : d.weekend ? 'bg-slate-50' : 'bg-white'} ${d.isToday ? 'ring-2 ring-inset ring-blue-400' : ''}`}>
                                            <div className="w-11 shrink-0 flex flex-col items-center pt-0.5">
                                                <span className={`inline-flex items-center justify-center min-w-[28px] h-[28px] rounded-full text-lg font-black leading-none ${d.isToday ? 'bg-blue-600 text-white px-1' : red ? 'text-rose-600' : 'text-slate-900'}`}>{date.getDate()}</span>
                                                <span className={`text-[11px] font-black ${red ? 'text-rose-600' : 'text-slate-500'}`}>週{'日一二三四五六'[date.getDay()]}</span>
                                                <span className={`text-[10px] font-bold ${d.lunarText.endsWith('月') ? 'text-orange-600' : 'text-slate-400'}`}>{d.lunarText}</span>
                                                {d.isPayday && <span className="text-xs" title="發薪日">🏧</span>}
                                            </div>
                                            <div className="flex-1 min-w-0 flex flex-col gap-1">
                                                {(d.holiday || d.focusSt) && (
                                                    <div className="flex items-center gap-1.5">
                                                        {d.focusSt && <FocusBadge st={d.focusSt} />}
                                                        {d.holiday && <span className="text-sky-700 text-xs font-black">{d.holiday}</span>}
                                                    </div>
                                                )}
                                                <Layers d={d} stretch={false} />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            // ===== 月曆格模式 =====
            const cells = [];
            for (let i = 0; i < totalCells; i++) cells.push(addDays(firstDay, i - offset));

            return (
                <div className="flex-1 min-h-0 flex flex-col p-1.5 sm:p-2">
                    <div className="flex-1 min-h-0 w-full max-w-[1500px] mx-auto bg-white rounded-2xl border-[3px] border-slate-800 shadow-[5px_5px_0px_rgba(0,0,0,0.12)] overflow-hidden flex flex-col">
                        {header}
                        <div className="shrink-0 grid grid-cols-7 bg-slate-50 border-b border-slate-200">
                            {['日', '一', '二', '三', '四', '五', '六'].map((w, i) => (
                                <div key={w} className={`py-0.5 text-center font-black text-xs ${i === 0 || i === 6 ? 'text-rose-600' : 'text-slate-600'}`}>{w}</div>
                            ))}
                        </div>
                        <div className="flex-1 min-h-0 grid grid-cols-7" style={{ gridTemplateRows: `repeat(${totalCells / 7}, minmax(0, 1fr))` }}>
                            {cells.map((date, idx) => {
                                const inMonth = date.getMonth() === month;
                                const d = computeDay(date);
                                let bg = 'bg-white';
                                if (d.holiday) bg = 'bg-sky-50/40';
                                else if (d.weekend) bg = 'bg-slate-50';
                                if (!inMonth) bg = 'bg-slate-50/60';
                                return (
                                    <div key={idx} onClick={() => onDayClick(d.dateStr)}
                                        className={`relative min-h-0 min-w-0 overflow-y-auto cal-cell border-r border-b border-slate-200 px-1 sm:px-1.5 py-1 [@media(max-height:820px)]:py-0.5 cursor-pointer hover:bg-amber-50/60 transition-colors flex flex-col ${bg} ${d.isToday ? 'ring-2 ring-inset ring-blue-400' : ''}`}>
                                        <div className={`flex items-center gap-1 mb-1 [@media(max-height:820px)]:mb-0.5 min-w-0 ${inMonth ? '' : 'opacity-30'}`}>
                                            <span className={`inline-flex items-center justify-center min-w-[22px] h-[22px] [@media(max-height:820px)]:h-[18px] [@media(max-height:820px)]:min-w-[18px] rounded-full text-[14px] [@media(max-height:820px)]:text-[13px] font-black leading-none ${d.isToday ? 'bg-blue-600 text-white px-1' : d.holiday || d.weekend ? 'text-rose-600' : 'text-slate-900'}`}>{date.getDate()}</span>
                                            {d.isPayday && <span className="text-xs leading-none" title="發薪日">🏧</span>}
                                            {d.focusSt && inMonth && <FocusBadge st={d.focusSt} />}
                                            <span className="ml-auto flex items-center gap-1 min-w-0">
                                                {d.holiday && <span className="text-sky-700 text-[11px] font-black truncate">{d.holiday}</span>}
                                                {!(stackDuty && d.holiday) && <span className={`text-[11px] font-bold whitespace-nowrap ${d.lunarText.endsWith('月') ? 'text-orange-600' : 'text-slate-500'}`}>{d.lunarText}</span>}
                                            </span>
                                        </div>
                                        {inMonth && <Layers d={d} />}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 小秘密：每一格的最後修改紀錄 ---
        // 存在另一份文件 cell_meta，不會把主班表撐大；每格只留「最後一次」是誰、何時、從什麼改成什麼
        const formatMetaTime = (ts) => {
            if (typeof ts === 'string') return ts; // 從舊紀錄補上、無法解析的時間就原樣顯示
            const d = new Date(ts);
            if (isNaN(d.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };
        const metaShiftName = (sid) => sid ? (SHIFT_TYPES[sid]?.name || sid) : '空白';
        // m.n：補登的批次動作說明；m.f === undefined：補登時不知道原本的班
        const getMetaChange = (m) => m.n ? m.n : (m.f === undefined ? `改為 ${metaShiftName(m.v)}` : `${metaShiftName(m.f)} → ${metaShiftName(m.v)}`);
        const getMetaText = (m) => m ? `${m.src === 'log' ? '📜' : '✏️'} ${m.b}  ${formatMetaTime(m.t)}\n${getMetaChange(m)}` : '';

        // 解析舊紀錄的時間字串，例如「2026/11/18 下午1:53:43」或「2026/11/18 13:53:43」
        const parseLogTime = (str) => {
            const m = String(str || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/i);
            if (!m) return str || '';
            let h = Number(m[5]);
            const ap = (m[4] || '').toUpperCase();
            if ((ap === '下午' || ap === 'PM') && h < 12) h += 12;
            if ((ap === '上午' || ap === 'AM') && h === 12) h = 0;
            return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), h, Number(m[6]), Number(m[7] || 0)).getTime();
        };

        // --- 桌曆的「當日班表」視窗 ---
        function DayEditModal({ dateStr, schedule, displayUsers, isLocked, onChange, onAutoFill, onClose, cellMeta = {} }) {
            if (!dateStr) return null;
            const date = parseDateStr(dateStr);
            const holiday = getHolidayName(date);
            const lunarL = getLunar(date);
            const lunarFull = lunarL ? `農曆${lunarL.leap ? '閏' : ''}${LUNAR_MONTH_NAMES[lunarL.month]}${LUNAR_DAY_NAMES[lunarL.day]}` : '';
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[70] flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-md border-2 border-slate-800 max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-start p-4 border-b border-slate-200">
                            <div>
                                <div className="text-2xl font-black text-slate-800">{date.getMonth() + 1}/{date.getDate()}（{'日一二三四五六'[date.getDay()]}）</div>
                                <div className="text-xs font-bold text-slate-400 mt-0.5">{lunarFull}{holiday && <span className="ml-2 bg-sky-500 text-white px-1.5 py-0.5 rounded-full">{holiday}</span>}</div>
                            </div>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600"><XIcon size={24} /></button>
                        </div>
                        {isLocked && <div className="mx-4 mt-3 text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">🔒 目前為鎖定（唯讀），解除鎖定後才能修改</div>}
                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            {displayUsers.map(u => {
                                const sid = schedule[u.name]?.[dateStr] || '';
                                const shift = SHIFT_TYPES[sid];
                                const meta = cellMeta[u.name]?.[dateStr];
                                return (
                                    <div key={u.id}>
                                    <div className="flex items-center gap-2">
                                        <span className="w-20 font-bold text-slate-800 truncate">{u.name}</span>
                                        <select
                                            value={sid}
                                            disabled={isLocked}
                                            onChange={e => onChange(u.name, dateStr, e.target.value || null)}
                                            className={`flex-1 rounded-lg border-2 px-2 py-1.5 font-bold text-sm outline-none ${shift ? shift.color : 'bg-white border-slate-200 text-slate-400'} ${isLocked ? 'cursor-not-allowed' : 'cursor-pointer'}`}
                                        >
                                            <option value="">{u.type === 'NORMAL' && !isWeekend(date) && !holiday ? '（未排・常日）' : '（未排）'}</option>
                                            {Object.values(SHIFT_TYPES).map(t => (<option key={t.id} value={t.id}>{t.name}　{t.time}</option>))}
                                        </select>
                                        {!isLocked && (
                                            <button onClick={() => onAutoFill(u.name, dateStr)} title="從這天開始自動排班" className="p-2 rounded-lg border-2 border-slate-800 bg-yellow-100 hover:bg-yellow-200 btn-press"><Zap size={14} fill="currentColor" className="text-yellow-600" /></button>
                                        )}
                                    </div>
                                    {meta && <div className="ml-[5.5rem] text-[10px] text-slate-400 leading-tight mt-0.5">{meta.src === 'log' ? '📜' : '✏️'} {meta.b}・{formatMetaTime(meta.t)}（{getMetaChange(meta)}）</div>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // --- APP COMPONENT ---
        function ShiftScheduleMatrix() {
            const [currentUser, setCurrentUserState] = useState(() => {
                try { const saved = localStorage.getItem('shift_current_user'); return saved ? JSON.parse(saved) : null; } catch (e) { return null; }
            });
            // 登入一次後記住這台裝置，下次打開不用再輸入
            const setCurrentUser = (user) => {
                setCurrentUserState(user);
                try { if (user) localStorage.setItem('shift_current_user', JSON.stringify(user)); else localStorage.removeItem('shift_current_user'); } catch (e) { }
            };
            const [viewStartDate, setViewStartDate] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 7); return d; });
            const [displayUsers, setDisplayUsers] = useState(INITIAL_USER_LIST);
            const [schedule, setSchedule] = useState({});
            const [rotationCycles, setRotationCycles] = useState({}); 
            const [weekNightCycles, setWeekNightCycles] = useState({}); 
            const [lastModifiedInfo, setLastModifiedInfo] = useState(null); 
            const [changeLogs, setChangeLogs] = useState([]); 
            const [selectedTool, setSelectedTool] = useState(null); 
            const scrollRef = useRef(null);
            
            const [isDragging, setIsDragging] = useState(false);
            const dragStartRef = useRef(false);
            const tempScheduleRef = useRef({}); 
            const lastDragCellRef = useRef(null);
            const editedUsersRef = useRef(new Set()); // 本次開啟頁面後有改過的人（存檔鈕只送這些人，避免蓋掉同事的修改）
            
            const [activeCell, setActiveCell] = useState(null);
            const [userStatsModal, setUserStatsModal] = useState(null); 
            const [showAutoFill, setShowAutoFill] = useState(false); 
            const [showSheetModal, setShowSheetModal] = useState(false); 
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', msg: '', action: null, isDangerous: false });
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [showLogModal, setShowLogModal] = useState(false); 
            const [showMenu, setShowMenu] = useState(false);
            const { w: viewportW } = useViewport();
            const compactHeader = viewportW < 1100; // 手機、iPhone Duo、平板直向：用精簡標題列
            const [toast, setToast] = useState(null);
            const fileInputRef = useRef(null);
            
            const [isLocked, setIsLocked] = useState(true);

            // 檢視模式：'table' 橫向表格 / 'calendar' 桌曆
            const [viewMode, setViewMode] = useState(() => { try { return localStorage.getItem('shift_view_mode') || 'table'; } catch (e) { return 'table'; } });
            const [calMonth, setCalMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
            const [dayModalDate, setDayModalDate] = useState(null);
            const changeViewMode = (mode) => { setViewMode(mode); setSelectedTool(null); try { localStorage.setItem('shift_view_mode', mode); } catch (e) { } };
            const activeYear = viewMode === 'calendar' ? calMonth.getFullYear() : viewStartDate.getFullYear();

            const [targetUser, setTargetUser] = useState(INITIAL_USER_LIST[0].name);
            const [autoStartDate, setAutoStartDate] = useState(getDateStr(new Date()));
            const [autoRule, setAutoRule] = useState('4-2');
            const [autoShiftType, setAutoShiftType] = useState('DAY_A');
            const [autoRounds, setAutoRounds] = useState(8); 
            const [autoWeeksDuration, setAutoWeeksDuration] = useState(1);

            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isSaving, setIsSaving] = useState(false); 
            const [isConnected, setIsConnected] = useState(false);
            const [permissionError, setPermissionError] = useState(false);
            const [dataLoaded, setDataLoaded] = useState(false); 
            const [cellMeta, setCellMeta] = useState({});
            const [metaInfo, setMetaInfo] = useState({ loaded: false, backfilled: false });
            const backfillStartedRef = useRef(false);
            const cloudScheduleRef = useRef({}); // 最後一次從雲端讀到的班表，用來比對「從什麼改成什麼」

            const showToast = (message, type = 'info') => { setToast({ message, type }); };

            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (error) { console.error("Auth failed:", error); } };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (user) => { setFirebaseUser(user); setIsConnected(!!user); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isConfigured || !firebaseUser || !db) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'shared_matrix');
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    setPermissionError(false); 
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const dbSchedule = data.schedule || {};
                        cloudScheduleRef.current = dbSchedule;
                        setSchedule(dbSchedule);
                        setRotationCycles(data.rotationCycles || {});
                        setWeekNightCycles(data.weekNightCycles || {});
                        setChangeLogs(data.changeLogs || []); 
                        if (data.lastModifiedBy && data.lastModifiedAt) {
                            setLastModifiedInfo({ by: data.lastModifiedBy, at: data.lastModifiedAt });
                        }
                        
                        const dbUserNames = Object.keys(dbSchedule);
                        const knownNames = new Set(INITIAL_USER_LIST.map(u => u.name));
                        const newDiscoveredUsers = [];
                        dbUserNames.forEach(name => { if (!knownNames.has(name)) { newDiscoveredUsers.push({ id: `auto-${name}`, name: name, type: 'NORMAL' }); } });
                        if (newDiscoveredUsers.length > 0) {
                            setDisplayUsers(prev => {
                                const currentNames = new Set(prev.map(u => u.name));
                                const uniqueNewUsers = newDiscoveredUsers.filter(u => !currentNames.has(u.name));
                                return [...INITIAL_USER_LIST, ...uniqueNewUsers];
                            });
                        }
                        try { localStorage.setItem('shift_schedule_backup', JSON.stringify(data)); } catch(e) { }
                    }
                    setDataLoaded(true); 
                }, (error) => {
                    console.error("Sync error:", error);
                    setIsConnected(false);
                    if (error.code === 'permission-denied') { setPermissionError(true); } else { showToast("資料同步失敗，請檢查網路", "error"); }
                });
                const metaRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'cell_meta');
                const unsubMeta = onSnapshot(metaRef, (snap) => { const d = snap.exists() ? snap.data() : {}; setCellMeta(d.cells || {}); setMetaInfo({ loaded: true, backfilled: !!d.backfilledFromLogs }); }, (err) => console.warn('cell_meta 讀取失敗', err));
                return () => { unsubscribe(); unsubMeta(); };
            }, [firebaseUser]);

            // 拖曳結束（滑鼠放開或手指離開）→ 一次存檔
            const finishDrag = () => {
                if (!dragStartRef.current) return false;
                dragStartRef.current = false;
                lastDragCellRef.current = null;
                setIsDragging(false);
                const touched = Object.keys(tempScheduleRef.current);
                if (touched.length > 0) {
                    const finalSchedule = { ...schedule };
                    const partialUpdate = { schedule: {} };
                    touched.forEach(u => {
                        finalSchedule[u] = { ...finalSchedule[u], ...tempScheduleRef.current[u] };
                        partialUpdate.schedule[u] = finalSchedule[u];
                    });
                    const logEntry = {
                        time: new Date().toLocaleString('zh-TW'),
                        user: currentUser ? currentUser.name : 'Unknown',
                        action: '批量修改 (拖曳)',
                        detail: `更新了 ${touched.length} 位人員的班表`
                    };
                    setSchedule(finalSchedule);
                    saveToDb(partialUpdate, false, logEntry);
                    tempScheduleRef.current = {};
                }
                return true;
            };
            const finishDragRef = useRef(finishDrag);
            finishDragRef.current = finishDrag;

            // 手機觸控：手指滑過的格子也套用工具
            const handleTouchMoveRef = useRef(null);
            handleTouchMoveRef.current = (e) => {
                if (!dragStartRef.current || !selectedTool || isLocked) return;
                const t = e.touches[0];
                if (!t) return;
                const el = document.elementFromPoint(t.clientX, t.clientY);
                const td = el && el.closest ? el.closest('td[data-date]') : null;
                if (!td) return;
                const key = `${td.dataset.user}|${td.dataset.date}`;
                if (lastDragCellRef.current === key) return;
                lastDragCellRef.current = key;
                applyToolToCell(td.dataset.user, td.dataset.date);
            };

            useEffect(() => {
                const onMouseUp = () => { finishDragRef.current(); };
                const onTouchEnd = (e) => { if (finishDragRef.current()) { try { e.preventDefault(); } catch (err) { } } };
                const onTouchMove = (e) => { if (dragStartRef.current) { handleTouchMoveRef.current(e); } };
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('touchend', onTouchEnd, { passive: false });
                window.addEventListener('touchcancel', onMouseUp);
                window.addEventListener('touchmove', onTouchMove, { passive: false });
                return () => {
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('touchend', onTouchEnd);
                    window.removeEventListener('touchcancel', onMouseUp);
                    window.removeEventListener('touchmove', onTouchMove);
                };
            }, []);

            // 比對雲端上的舊值，只記錄真的有變的格子
            // 注意：一定要在 setDoc 之前算好，因為 setDoc 一呼叫，本機快照就會先更新成新值
            const buildCellMeta = (partialSchedule) => {
                if (!partialSchedule) return null;
                const now = Date.now();
                const by = currentUser ? currentUser.name : 'Unknown';
                const cells = {};
                let count = 0;
                Object.keys(partialSchedule).forEach(u => {
                    const userSch = partialSchedule[u];
                    if (!userSch || typeof userSch !== 'object' || Array.isArray(userSch) || userSch.constructor !== Object) return; // deleteField 等特殊值略過
                    const oldSch = cloudScheduleRef.current[u] || {};
                    Object.keys(userSch).forEach(dateStr => {
                        const before = oldSch[dateStr] || null;
                        const after = userSch[dateStr] || null;
                        if (before === after) return;
                        (cells[u] = cells[u] || {})[dateStr] = { b: by, t: now, f: before, v: after };
                        count++;
                    });
                });
                return count > 0 ? cells : null;
            };
            // 一次性：把左上角「紀錄」裡還留著的那幾筆，補進每格的修改紀錄（只補還沒有紀錄的格子）
            useEffect(() => {
                if (!dataLoaded || !metaInfo.loaded || metaInfo.backfilled || !currentUser || !db || backfillStartedRef.current) return;
                backfillStartedRef.current = true;
                const cells = {};
                const put = (u, dateStr, entry) => {
                    if (cellMeta[u]?.[dateStr]) return; // 已有真正的紀錄就不覆蓋
                    (cells[u] = cells[u] || {})[dateStr] = entry;
                };
                [...changeLogs].reverse().forEach(log => { // 由舊到新，新的蓋掉舊的
                    if (!log || !log.action) return;
                    const t = parseLogTime(log.time);
                    const base = { b: log.user || '?', t, src: 'log' };
                    const single = String(log.detail || '').match(/^(.+) \/ (\d{4}-\d{2}-\d{2})$/);
                    if (single && (log.action.startsWith('排班: ') || log.action === '清除')) {
                        const v = log.action === '清除' ? null : (getShiftIdByName(log.action.slice(4)) || log.action.slice(4));
                        put(single[1], single[2], { ...base, v });
                        return;
                    }
                    const auto = String(log.detail || '').match(/^(.+) 從 (\d{4}-\d{2}-\d{2})/);
                    if (auto && log.action.startsWith('自動排班')) {
                        const [, u, start] = auto;
                        const cycles = log.action.includes('4-2') ? rotationCycles[u] : weekNightCycles[u];
                        const cycle = (cycles || []).find(c => c.start === start);
                        if (!cycle) return;
                        let d = parseDateStr(cycle.start);
                        const end = parseDateStr(cycle.end);
                        if (log.action.includes('4-2')) { const pre = getPreRestDate(cycle.start); if (pre) put(u, pre, { ...base, n: '自動排班（前休一）' }); }
                        while (d <= end) { put(u, getDateStr(d), { ...base, n: log.action }); d = addDays(d, 1); }
                    }
                    // 「拖曳」「匯入」這類紀錄沒有記下是哪幾格，無法補
                });
                const metaRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'cell_meta');
                setDoc(metaRef, { cells, backfilledFromLogs: true }, { merge: true }).catch(e => { console.warn('補登失敗', e); backfillStartedRef.current = false; });
            }, [dataLoaded, metaInfo, currentUser, changeLogs, rotationCycles, weekNightCycles]);

            const commitCellMeta = (cells) => {
                if (!cells || !db) return;
                const metaRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'cell_meta');
                setDoc(metaRef, { cells }, { merge: true }).catch(e => console.warn('cell_meta 寫入失敗', e));
            };

            const saveToDb = (newData = {}, isOverwrite = false, logEntry = null) => {
                return new Promise(async (resolve) => {
                    if (!dataLoaded && !isOverwrite) {
                        showToast("⚠️ 資料尚未讀取完畢，禁止存檔以免覆蓋", "error");
                        resolve(false);
                        return;
                    }
                    
                    if (newData.schedule) Object.keys(newData.schedule).forEach(u => editedUsersRef.current.add(u));
                    let newLogs = [...changeLogs];
                    if (logEntry) {
                        newLogs.unshift(logEntry);
                        if (newLogs.length > 20) newLogs = newLogs.slice(0, 20); 
                    }

                    if (!isConfigured) { resolve(true); return; }
                    if (!auth || !firebaseUser) {
                        if (!isOverwrite) showToast("尚未連線", "error");
                        signInAnonymously(auth).catch(e => console.error(e));
                        resolve(false); return;
                    }

                    setIsSaving(true);
                    setPermissionError(false); 
                    const timeoutPromise = new Promise(r => setTimeout(() => r('TIMEOUT'), 15000)); 
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shift_schedule_team', 'shared_matrix');
                    const now = new Date();
                    const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    
                    const dataToSave = { 
                        ...newData,
                        changeLogs: newLogs,
                        lastModifiedBy: currentUser ? currentUser.name : 'Unknown',
                        lastModifiedAt: timeString
                    };

                    const pendingMeta = buildCellMeta(newData.schedule);
                    try {
                        const options = { merge: true };
                        const result = await Promise.race([ setDoc(docRef, dataToSave, options), timeoutPromise ]);
                        if (result === 'TIMEOUT') throw new Error("Save timeout");
                        
                        setChangeLogs(newLogs); 
                        commitCellMeta(pendingMeta);
                        if (!isOverwrite) showToast("雲端同步成功！", "success");
                        resolve(true);
                    } catch (e) {
                        console.error("Save error:", e);
                        if (e.code === 'permission-denied') { setPermissionError(true); if (!isOverwrite) showToast("儲存失敗：權限不足", "error"); }
                        else if (e.message === "Save timeout") { if (!isOverwrite) showToast("連線逾時", "warning"); }
                        else { if (!isOverwrite) showToast(`儲存失敗: ${e.message}`, "error"); }
                        resolve(false);
                    } finally { setIsSaving(false); }
                });
            };

            const forceReload = () => {
                if(confirm('確定要強制從雲端重新讀取資料嗎？未存檔的修改將會消失。')) {
                    setDataLoaded(false);
                    window.location.reload(); 
                }
            };

            const handleSheetImport = (partialSchedule) => {
                const newSchedule = { ...schedule };
                let updateCount = 0;
                Object.keys(partialSchedule).forEach(user => {
                    const userSch = { ...(newSchedule[user] || {}) };
                    Object.keys(partialSchedule[user]).forEach(date => {
                        userSch[date] = partialSchedule[user][date];
                        updateCount++;
                    });
                    newSchedule[user] = userSch;
                });
                
                setSchedule(newSchedule); 
                saveToDb({ schedule: partialSchedule }, false, {
                    time: new Date().toLocaleString('zh-TW'),
                    user: currentUser.name,
                    action: '從 Google Sheet 還原',
                    detail: `更新了 ${updateCount} 筆資料`
                });
                showToast(`成功合併 ${updateCount} 筆資料！`, "success");
            };

            const prevPeriod = () => {
                if (viewMode === 'calendar') { setCalMonth(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1)); return; }
                setViewStartDate(prev => { const d = new Date(prev); d.setDate(d.getDate() - 14); return d; });
            };
            const nextPeriod = () => {
                if (viewMode === 'calendar') { setCalMonth(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1)); return; }
                setViewStartDate(prev => { const d = new Date(prev); d.setDate(d.getDate() + 14); return d; });
            };
            const goToToday = () => {
                const now = new Date();
                setCalMonth(new Date(now.getFullYear(), now.getMonth(), 1));
                const d = new Date(); d.setDate(d.getDate() - 7); setViewStartDate(d);
            };

            // 桌曆視窗：直接設定某人某天的班
            const setUserShift = (userName, dateStr, shiftId) => {
                if (isLocked) { showToast("🔒 請先解除鎖定才能編輯喔！", "warning"); return; }
                const userSchedule = { ...(schedule[userName] || {}), [dateStr]: shiftId || null };
                setSchedule({ ...schedule, [userName]: userSchedule });
                saveToDb({ schedule: { [userName]: userSchedule } }, false, {
                    time: new Date().toLocaleString('zh-TW'), user: currentUser.name,
                    action: shiftId ? `排班: ${SHIFT_TYPES[shiftId]?.name || shiftId}` : '清除',
                    detail: `${userName} / ${dateStr}`
                });
            };

            const handleLogout = async () => {
                setCurrentUser(null); setSelectedTool(null); setDayModalDate(null);
            };

            const handleCellMouseDown = (e, userName, dateStr) => {
                if (isLocked) { showToast("🔒 請先解除鎖定才能編輯喔！", "warning"); return; }
                if (!selectedTool) {
                    const currentShift = schedule[userName]?.[dateStr];
                    setActiveCell({ user: userName, dateStr, currentShift });
                    return;
                }
                dragStartRef.current = true;
                setIsDragging(true);
                tempScheduleRef.current = {}; 
                applyToolToCell(userName, dateStr); 
            };

            const handleCellMouseEnter = (e, userName, dateStr) => {
                if (isLocked) return; 
                if (dragStartRef.current && selectedTool) {
                    applyToolToCell(userName, dateStr);
                }
            };

            const applyToolToCell = (userName, dateStr) => {
                const newSchedule = { ...schedule }; 
                Object.keys(tempScheduleRef.current).forEach(u => {
                    newSchedule[u] = { ...newSchedule[u], ...tempScheduleRef.current[u] };
                });

                const userSchedule = { ...(newSchedule[userName] || {}) };
                if (selectedTool === 'ERASER') { 
                    userSchedule[dateStr] = null; // KEY FIX: Set to null instead of delete to force override in merge
                } else { 
                    userSchedule[dateStr] = selectedTool; 
                }
                
                if (!tempScheduleRef.current[userName]) tempScheduleRef.current[userName] = {};
                 tempScheduleRef.current[userName] = userSchedule;

                newSchedule[userName] = userSchedule;
                setSchedule(newSchedule);
            };

            const handleCellTouchStart = (e, userName, dateStr) => {
                if (isLocked || !selectedTool) return; // 點一下的情況交給 mousedown 處理（開選單 / 鎖定提示）
                dragStartRef.current = true;
                setIsDragging(true);
                tempScheduleRef.current = {};
                lastDragCellRef.current = `${userName}|${dateStr}`;
                applyToolToCell(userName, dateStr);
            };

            const toggleTool = (toolId) => { if (selectedTool === toolId) setSelectedTool(null); else setSelectedTool(toolId); };

            const applyShiftFromModal = (shiftId) => {
                if (!activeCell) return;
                const { user, dateStr } = activeCell;
                const newSchedule = { ...schedule };
                const userSchedule = { ...(newSchedule[user] || {}) };
                
                let actionStr = '';
                if (shiftId === 'ERASER') { 
                    userSchedule[dateStr] = null; // KEY FIX
                    actionStr = '清除'; 
                } 
                else { userSchedule[dateStr] = shiftId; actionStr = `排班: ${SHIFT_TYPES[shiftId].name}`; }
                newSchedule[user] = userSchedule;
                
                const logEntry = { time: new Date().toLocaleString('zh-TW'), user: currentUser.name, action: actionStr, detail: `${user} / ${dateStr}` };

                setSchedule(newSchedule);
                saveToDb({ schedule: { [user]: userSchedule } }, false, logEntry);
                setActiveCell(null);
            };

            const openAutoFillFromCell = () => {
                if (!activeCell) return;
                setTargetUser(activeCell.user); setAutoStartDate(activeCell.dateStr);
                setActiveCell(null); setShowAutoFill(true);
            };

            const confirmClearUser = (userName) => {
                setConfirmModal({
                    show: true, title: `清除 ${userName} 的紀錄`, msg: `確定要清除該人員的所有排班紀錄嗎？`, isDangerous: true,
                    action: () => {
                        const newSchedule = { ...schedule };
                        delete newSchedule[userName]; 
                        setSchedule(newSchedule);
                        // 用 deleteField() 才能真正刪除雲端上這個人的所有日期
                        saveToDb({ schedule: { [userName]: deleteField() } }, false, { time: new Date().toLocaleString('zh-TW'), user: currentUser.name, action: '清除人員紀錄', detail: `清除了 ${userName} 的所有排班` });
                        setConfirmModal({ show: false });
                        setUserStatsModal(null); 
                    }
                });
            };

            // 四二輪起始日為週六/週日 → 前休一：起始日前一天標「休」，之後排法不變
            const getPreRestDate = (startStr) => {
                const d = parseDateStr(startStr);
                if (isNaN(d.getTime())) return null;
                const dow = d.getDay();
                return (dow === 6 || dow === 0) ? getDateStr(addDays(d, -1)) : null;
            };

            const runAutoFill = () => {
                const start = parseDateStr(autoStartDate);
                if (isNaN(start.getTime())) return;
                let end = new Date(start);
                let endDateStr = '';

                if (autoRule === '4-2') {
                    const totalDays = autoRounds * 4;
                    const endDateObj = new Date(start);
                    endDateObj.setDate(start.getDate() + totalDays - 1); 
                    endDateStr = getDateStr(endDateObj);
                } else if (autoRule === 'week-night') {
                    const endDateObj = new Date(start);
                    endDateObj.setDate(start.getDate() + (autoWeeksDuration * 7) - 1);
                    endDateStr = getDateStr(endDateObj);
                    end = endDateObj; 
                } 

                const newSchedule = { ...schedule };
                const userSch = { ...(newSchedule[targetUser] || {}) };
                let current = new Date(start);

                if (autoRule === '4-2') {
                    const newCycles = { ...rotationCycles };
                    newCycles[targetUser] = [...(newCycles[targetUser] || []), { start: autoStartDate, end: endDateStr }];
                    const totalDays = autoRounds * 4;
                    const preRest = getPreRestDate(autoStartDate);
                    if (preRest) userSch[preRest] = 'REST';
                    for (let i = 0; i < totalDays; i++) {
                        let d = new Date(start); d.setDate(start.getDate() + i); const dStr = getDateStr(d);
                        if (i % 4 < 2) { userSch[dStr] = autoShiftType; } else { userSch[dStr] = 'REST'; }
                    }
                    newSchedule[targetUser] = userSch;
                    setSchedule(newSchedule);
                    setRotationCycles(newCycles);
                    saveToDb({ schedule: { [targetUser]: userSch }, rotationCycles: newCycles }, false, { time: new Date().toLocaleString('zh-TW'), user: currentUser.name, action: '自動排班 (4-2)', detail: `${targetUser} 從 ${autoStartDate}${getPreRestDate(autoStartDate) ? `（前休一 ${getPreRestDate(autoStartDate)}）` : ''}` });
                } else if (autoRule === 'week-night') {
                    const newWNCycles = { ...weekNightCycles };
                    newWNCycles[targetUser] = [...(newWNCycles[targetUser] || []), { start: autoStartDate, end: endDateStr }];
                    const endLoop = new Date(start);
                    endLoop.setDate(start.getDate() + (autoWeeksDuration * 7));
                    while (current < endLoop) {
                        const day = current.getDay();
                        if (day !== 6) userSch[getDateStr(current)] = 'EVE_WEEKDAY';
                        current.setDate(current.getDate() + 1);
                    }
                    newSchedule[targetUser] = userSch;
                    setSchedule(newSchedule);
                    setWeekNightCycles(newWNCycles);
                    saveToDb({ schedule: { [targetUser]: userSch }, weekNightCycles: newWNCycles }, false, { time: new Date().toLocaleString('zh-TW'), user: currentUser.name, action: '自動排班 (小夜)', detail: `${targetUser} 從 ${autoStartDate}` });
                }
                setShowAutoFill(false);
            };

            const daysData = useMemo(() => {
                const arr = [];
                for (let i = 0; i < 30; i++) {
                    const date = new Date(viewStartDate);
                    date.setDate(viewStartDate.getDate() + i);
                    const dateStr = getDateStr(date);
                    const holidayName = getHolidayName(date);
                    arr.push({
                        date, dateStr, dayNum: date.getDate(),
                        dayOfWeek: ['日','一','二','三','四','五','六'][date.getDay()],
                        isWeekend: isWeekend(date),
                        holiday: holidayName,
                        monthLabel: `${date.getFullYear()}年${date.getMonth()+1}月`
                    });
                }
                return arr;
            }, [viewStartDate]);

            const monthGroups = useMemo(() => {
                const groups = [];
                if (daysData.length === 0) return groups;
                let currentMonth = daysData[0].monthLabel;
                let count = 0;
                daysData.forEach(day => {
                    if (day.monthLabel === currentMonth) { count++; } 
                    else { groups.push({ label: currentMonth, count }); currentMonth = day.monthLabel; count = 1; }
                });
                groups.push({ label: currentMonth, count });
                return groups;
            }, [daysData]);

            const calculateYearlyStats = (userName) => {
                const year = activeYear; 
                const stats = {};
                const user = displayUsers.find(u => u.name === userName); 

                const d = new Date(year, 0, 1);
                const end = new Date(year, 11, 31);
                
                while (d <= end) {
                    const dateStr = getDateStr(d);
                    const s = schedule[userName]?.[dateStr];
                    
                    if (s) {
                        stats[s] = (stats[s] || 0) + 1;
                    } else {
                        const day = d.getDay();
                        const isWknd = day === 0 || day === 6;
                        const isHol = !!getHolidayName(d);
                        
                        if (user && user.type === 'NORMAL' && !isWknd && !isHol) {
                            stats['NORMAL'] = (stats['NORMAL'] || 0) + 1;
                        }
                    }
                    d.setDate(d.getDate() + 1);
                }
                return { stats, year };
            };

            const handleUserClick = (userName) => {
                const { stats, year } = calculateYearlyStats(userName); 
                setUserStatsModal({ name: userName, stats, year });
            };

            const handleExport = () => {
                if (!schedule) return;
                
                const targetYear = activeYear;
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const monthBlocks = []; 

                const ws_data = [];
                let currentRow = 0;

                for (let month = 0; month < 12; month++) {
                    const firstDay = new Date(targetYear, month, 1);
                    const lastDay = new Date(targetYear, month + 1, 0);
                    const totalDays = lastDay.getDate();
                    const monthStartRow = currentRow;

                    const headerRow = [`${monthNames[month]}-${String(targetYear).slice(-2)}`];
                    const weekendCols = [];
                    const holidayCols = [];

                    for (let d = 1; d <= totalDays; d++) {
                        headerRow.push(d);
                        const currentDate = new Date(targetYear, month, d);
                        const day = currentDate.getDay();
                        if (day === 0 || day === 6) weekendCols.push(d); 
                        if (getHolidayName(currentDate)) holidayCols.push(d);
                    }
                    ws_data.push(headerRow);
                    currentRow++;

                    displayUsers.forEach(user => {
                        const row = [user.name];
                        for (let d = 1; d <= totalDays; d++) {
                            const date = new Date(targetYear, month, d);
                            const dateStr = getDateStr(date);
                            const shiftId = schedule[user.name]?.[dateStr];
                            const excelCode = getExcelCode(shiftId);
                            row.push(excelCode);
                        }
                        ws_data.push(row);
                        currentRow++;
                    });

                    monthBlocks.push({
                        startRow: monthStartRow,
                        endRow: currentRow - 1,
                        totalDays: totalDays,
                        weekendCols: weekendCols,
                        holidayCols: holidayCols
                    });

                    ws_data.push([]);
                    currentRow++;
                }

                const ws = XLSX.utils.aoa_to_sheet(ws_data);

                const thinBorder = { style: "thin", color: { rgb: "000000" } };
                const thickBorder = { style: "medium", color: { rgb: "000000" } }; 
                const blueFill = { fgColor: { rgb: "DDEBF7" } }; 
                const centerAlign = { horizontal: "center", vertical: "center" };

                monthBlocks.forEach(block => {
                    const lastColIndex = block.totalDays; 
                    
                    for (let r = block.startRow; r <= block.endRow; r++) {
                        for (let c = 0; c <= lastColIndex; c++) {
                            const cellRef = XLSX.utils.encode_cell({ r, c });
                            if (!ws[cellRef]) ws[cellRef] = { v: "", t: "s" }; 

                            let s = {
                                border: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder },
                                alignment: centerAlign,
                                font: { name: "Calibri", sz: 11 }
                            };

                            if (r === block.startRow) { s.font.bold = true; }

                            if (c > 0) {
                                if (block.weekendCols.includes(c) || block.holidayCols.includes(c)) { s.fill = blueFill; }
                            }

                            if (r === block.startRow) s.border.top = thickBorder;
                            if (r === block.endRow) s.border.bottom = thickBorder;
                            if (c === 0) s.border.left = thickBorder;
                            if (c === lastColIndex) s.border.right = thickBorder;

                            ws[cellRef].s = s;
                        }
                    }
                });

                const wscols = [{ wch: 10 }]; 
                for(let i=0; i<31; i++) wscols.push({ wch: 4 }); 
                ws['!cols'] = wscols;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `${targetYear}年全年度班表`);
                XLSX.writeFile(wb, `ShiftSchedule_${targetYear}.xlsx`);
            };

            const handleImportClick = () => { fileInputRef.current.click(); };
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsName = wb.SheetNames[0];
                        const ws = wb.Sheets[wsName];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        if (data.length < 2) { showToast("Excel 格式錯誤或無資料", "error"); return; }
                        const headerRow = data[0];
                        
                        const bulkUpdate = {}; 
                        // 表頭日期：接受 'YYYY-MM-DD' 文字，或 Excel 的日期格式（數字）
                        const toDateStr = (v) => {
                            if (typeof v === 'number' && v > 30000 && XLSX.SSF) {
                                const p = XLSX.SSF.parse_date_code(v);
                                if (p) return `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`;
                            }
                            const str = String(v ?? '').trim();
                            return /^\d{4}-\d{2}-\d{2}$/.test(str) ? str : null;
                        };
                        const headerDates = headerRow.map(toDateStr);
                        let skipped = 0;
                        
                        for (let i = 1; i < data.length; i++) {
                            const row = data[i];
                            const userName = row && typeof row[0] === 'string' ? row[0].trim() : '';
                            if (!userName) continue;
                            const updates = {};
                            for (let j = 1; j < row.length; j++) {
                                const dateStr = headerDates[j];
                                const shiftName = typeof row[j] === 'string' ? row[j].trim() : '';
                                if (dateStr && shiftName) {
                                    const shiftId = getShiftIdByName(shiftName);
                                    if (shiftId) updates[dateStr] = shiftId;
                                }
                            }

                            if (Object.keys(updates).length === 0) { skipped++; continue; }
                            bulkUpdate[userName] = { ...(schedule[userName] || {}), ...updates };
                        }

                            action: '匯入 Excel',
                            detail: '批量更新班表'
                        });
                        showToast("Excel 匯入合併成功！", "success");
                    } catch (err) { console.error("Import Error:", err); showToast("匯入失敗，請檢查檔案格式", "error"); } finally { e.target.value = ''; }
                };
